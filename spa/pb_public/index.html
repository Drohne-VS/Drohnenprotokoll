<html lang="de">

<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7fa;--card:#fff;--ink:#0f2433;--mute:#5d7282;--line:#dde6ec;
  --brand:#0b6e99;--brand2:#e3f2f9;
  --ok:#1f8a4c;--okbg:#e5f5ec;--warn:#b26a00;--warnbg:#fff3df;--crit:#c0362c;--critbg:#fde8e6;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1820;--card:#15242f;--ink:#e6eef3;--mute:#93a7b5;--line:#25384a;--brand:#4fb3df;--brand2:#173546;
  --ok:#4cc27e;--okbg:#143326;--warn:#f0a83a;--warnbg:#3a2c12;--crit:#ff6b5e;--critbg:#3d1a17;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
main{max-width:760px;margin:0 auto;padding:14px 14px 96px}
.pools{display:flex;gap:6px}
.pools button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600}
.pools button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.status{display:flex;align-items:center;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.ok .dot,.dot.ok{background:var(--ok)}.warn .dot,.dot.warn{background:var(--warn)}.crit .dot,.dot.crit{background:var(--crit)}.none .dot,.dot.none{background:var(--line)}
.status.ok{background:var(--okbg)}.status.warn{background:var(--warnbg)}.status.crit{background:var(--critbg)}
.status b{font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tile{border-radius:12px;padding:10px;border:1px solid var(--line)}
.tile.ok{background:var(--okbg);border-color:transparent}.tile.warn{background:var(--warnbg);border-color:transparent}.tile.crit{background:var(--critbg);border-color:transparent}
.tile .l{font-size:12px;color:var(--mute)}.tile .v{font-size:20px;font-weight:700}.tile .t{font-size:12px}
.rec{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .dot{margin-top:4px}
.rec .amt{font-weight:700;color:var(--brand)}
.small{font-size:13px;color:var(--mute)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
fieldset:disabled input,fieldset:disabled select{opacity:.75}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;border:0;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--brand2);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.btn.full{width:100%;margin-top:14px}
.btn.sm{padding:6px 10px;font-size:13px}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .grow{flex:1}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.crit{background:var(--critbg);color:var(--crit)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:150px;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--brand);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td.c-ok{color:var(--ok)}td.c-warn{color:var(--warn)}td.c-crit{color:var(--crit);font-weight:600}
.banner{background:var(--brand2);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.banner b{color:var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.seg button:disabled{opacity:.4}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.sync{font-size:12px;color:var(--mute);margin-left:auto;font-weight:400}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .card{width:100%;max-width:520px;margin:0;border-radius:18px 18px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.chart svg{width:100%;height:auto}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
.hidden{display:none}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30}
</style>
</head>
<body>
<header>
  <h1>💧 Spa-Wasserpflege <span class="sync" id="sync">lädt …</span></h1>
  <div class="pools" id="pools"></div>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"></div>

<script>
/* ================= Fachlogik =================
   Quelle Dosierung/Ablauf: SpaBalancer-Wasserpflegeanleitungen (Hartschalen-Whirlpools / Swim Spas).
   Werte sind Voreinstellungen – maßgeblich ist immer das Produktetikett. */

const DAY = 864e5;
const fmt = (n, d=0) => (n==null||isNaN(n)) ? '–' : Number(n).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const round5 = ml => Math.max(5, Math.round(ml/5)*5);
const dHfromMg = mg => mg/17.85;

function interp(points, v){
  const p = [...points].sort((a,b)=>a[0]-b[0]);
  if (v <= p[0][0]) { const [a,b]=[p[0],p[1]]; return a[1]+(v-a[0])*(b[1]-a[1])/(b[0]-a[0]); }
  for (let i=1;i<p.length;i++) if (v<=p[i][0]) { const a=p[i-1],b=p[i]; return a[1]+(v-a[0])*(b[1]-a[1])/(b[0]-a[0]); }
  const a=p[p.length-2],b=p[p.length-1]; return b[1]+(v-b[0])*(b[1]-a[1])/(b[0]-a[0]);
}
// SpaBalancer-Tabelle Hartschalen-Whirlpool (wöchentlich)
const WP_US = [[500,30],[1000,40],[1300,50],[1600,60]];
const WP_BASIC = [[500,40],[1000,50],[1300,60],[1600,70]];

function defaultDoses(type, vol){
  if (type==='whirlpool') return { usWeek: round5(interp(WP_US,vol)), basicWeek: round5(interp(WP_BASIC,vol)) };
  // Swim-Spa: UltraShock 80–200 ml bei 4.000–10.000 l (20 ml je 1.000 l); Basic-Tabelle nicht lesbar -> leer lassen
  return { usWeek: round5(vol/1000*20), basicWeek: null };
}

const TASKS = [
  {k:'ph',     name:'Wasser messen (pH + UltraShock)',     days:7,   start:1,  note:'Im Regelbetrieb 1× pro Woche, nach Neubefüllung täglich. Einmal pro Woche auch die Alkalinität. Am besten mit „Wasser messen – Schritt für Schritt“.'},
  {k:'weekly', name:'Wochendosis Basic + UltraShock',     days:7,   note:'Zwischen UltraShock und Basic mindestens 3 Stunden Abstand.'},
  {k:'filter', name:'Filter tauschen & reinigen',         days:14,  start:7,  note:'Sauberen Filter einsetzen, den alten mit Filterbrause und Filterreiniger säubern. Alle 1–2 Wochen, nach Neubefüllung 1–2× pro Woche.'},
  {k:'soft',   name:'SoftWater (monatlich)',              days:30,  note:'50 ml je 1.000 l, beim Nachfüllen anteilig.'},
  {k:'cover',  name:'Abdeckung reinigen / prüfen',        days:30,  note:'Unterseite auf muffigen Geruch prüfen.'},
  {k:'germ',   name:'Keimtest (Eintauchnährboden)',        days:30,  note:'Zur Sicherheit 1× im Monat: Nährboden ins Wasser tauchen, 48 Std. bei Zimmertemperatur liegen lassen, Kolonien mit der Vergleichskarte ablesen und unter „Messen“ eintragen.'},
  {k:'change', name:'Wasserwechsel + Grundreinigung',     days:182, note:'Idealerweise alle 6, spätestens alle 12 Monate. Vorher Grundreinigung mit SystemFlush, danach Neubefüllung starten.'},
];

const isBS = p => p.cfg.plan==='bundschuh';
function lastPh(p){ for (let i=p.log.length-1;i>=0;i--) if (p.log[i].ph!=null) return p.log[i]; return null; }
function phHigh(p){ const m=lastPh(p); return !!(m && m.ph>p.cfg.bs.phMax); }
function effCfg(p, mode){ // mode 'norm' = SpaBalancer/Normwerte
  const c=p.cfg; if (mode==='norm' || !isBS(p)) return c;
  const b=c.bs; return {...c, phMin:b.phMin, phMax:b.phMax, phCritLow:b.phCritLow, phCrit:b.phCrit, usWeek:b.usWeek, basicWeek:b.basicWeek, usMin:0.1};
}
function getTasks(p){
  if (!isBS(p)) return TASKS.filter(t=>t.k!=='germ');
  const b=p.cfg.bs;
  return TASKS.filter(t=>t.k!=='soft').map(t=>{
    if (t.k==='ph'){ const hi=phHigh(p);
      return hi ? {...t, name:'pH täglich messen (über Ziel)', days:1, fixed:true, start:null, note:`Der pH liegt über ${fmt(b.phMax,1)}. Jeden Tag messen und ggf. ${b.minusG} g pH-Minus geben, bis er im Ziel ${fmt(b.phMin,1)}–${fmt(b.phMax,1)} ist. Danach wieder wöchentlich.`}
                : {...t, name:'Wöchentliche Kontrollmessung', days:b.ctrlDays, fixed:true, start:null, note:`Alle ${b.ctrlDays} Tage pH, UltraShock und Alkalinität mit dem PoolLab messen. Mit „Wasser messen – Schritt für Schritt“.`}; }
    if (t.k==='germ') return {...t, days:p.cfg.germDays, fixed:true};
    if (t.k==='weekly') return {...t, name:`Wochendosis ${b.usWeek} ml UltraShock + ${b.basicWeek} ml Basic`, note:'Zwischen UltraShock und Basic mindestens 3 Stunden Abstand.'};
    if (t.k==='filter') return {...t, name:'Filter tauschen & ausspülen', days:b.rinseDays, fixed:true, start:null, note:`Sauberen Filter einsetzen, den ausgebauten nur ausspülen. Grundreinigung mit FilterClean erst nach ${p.cfg.filterDeepDays} Einsatztagen – die App zählt das je Filter mit.`};
    return t;
  });
}
function defaultPool(type){
  const vol = type==='whirlpool'?1325:8000;
  return {
    type, active: type==='whirlpool',
    name: type==='whirlpool'?'Cameo':'Swim-Spa',
    cfg: {
      vol, volConfirmed: type==='whirlpool',
      filterLifeMonths:12, filterMaxClean:25, filterDeepDays:90,
      plan: type==='whirlpool' ? 'bundschuh' : 'spabalancer',
      bs: { phMin:6.5, phMax:6.8, phCritLow:6.2, phCrit:7.6, minusG:30, usWeek:30, basicWeek:30, softPer5:40, ctrlDays:7, rinseDays:14, dropDays:3 },
      ...defaultDoses(type, vol), dosesCustom:false,
      shockPer1000: 50,          // Schockbehandlung ml je 1.000 l (8 h einwirken)
      phMinusGper01: 10,         // g pH-Minus je 0,1 pH je 1.000 l (Etikett!)
      phPlusGper01: 10,
      phMin:6.8, phMax:7.8, phCrit:8.0, phCritLow:6.5,
      usMin:0.3, usMax:5,
      taMin:80, taMax:120, taPlusGper10:17, ureaMax:1.0, germDays:30,
      hardMax:12,
      intervals: Object.fromEntries(TASKS.map(t=>[t.k,t.days])),
    },
    filledAt:null,
    tasks:{},          // k -> ISO zuletzt erledigt
    germs:[],          // Keimtests {at, level, note, by}
    filters: type==='whirlpool' ? [1,2,3].map(n=>({n, status:n===1?'in':'spare', since:null, cleanings:0, lastClean:null, uses:0, inAt:null, useMs:0, rinses:0})) : [],
    phDrop:null,       // {start, doses:[ISO], ended}
    log:[],            // Messungen
    baths:[],          // {at, persons}
    doses:[],          // {at, what, amount}
  };
}

function startPhase(pool, now=Date.now()){
  if(!pool.filledAt) return null;
  const d = Math.floor((now - new Date(pool.filledAt).getTime())/DAY)+1;
  return d>=1 && d<=14 ? d : null;
}

function rate(val, okLo, okHi, critLo, critHi){
  if (val==null||isNaN(val)) return null;
  if ((critLo!=null && val<critLo) || (critHi!=null && val>critHi)) return 'crit';
  if ((okLo!=null && val<okLo) || (okHi!=null && val>okHi)) return 'warn';
  return 'ok';
}
const worst = arr => arr.includes('crit')?'crit':arr.includes('warn')?'warn':arr.some(Boolean)?'ok':'none';

function evaluate(m, pool, mode, now=Date.now()){
  const bsMode = isBS(pool) && mode!=='norm';
  const c = effCfg(pool, mode), V = c.vol/1000, phase = startPhase(pool, now), b = pool.cfg.bs;
  const P = [], R = [];
  // pH
  if (m.ph!=null){
    const s = rate(m.ph, c.phMin, c.phMax, c.phCritLow, c.phCrit-0.0001);
    P.push({k:'ph', l:'pH-Wert', v:fmt(m.ph,2), s, t: s==='ok'?`Ziel ${fmt(c.phMin,1)}–${fmt(c.phMax,1)}` : m.ph>c.phMax ? (bsMode?`über Ziel ${fmt(c.phMin,1)}–${fmt(c.phMax,1)}`:(m.ph>=c.phCrit?'zu hoch – Kalkausfall möglich':'leicht zu hoch')) : (bsMode&&m.ph<c.phCritLow?'zu sauer':'zu niedrig')});
    if (bsMode && m.ph>c.phMax){
      R.push({s:m.ph>=c.phCrit?'crit':'warn', t:'pH-Minus zugeben', a:`${fmt(b.minusG)} g`, d:`Nach Bundschuh: ${b.minusG} g bei laufenden Pumpen. Ab jetzt jeden Tag den pH messen (nur Kammer 1 reicht) und jeweils ${b.minusG} g geben, solange er über ${fmt(c.phMax,1)} liegt. Ist er im Ziel, kein pH-Minus mehr – dann nur noch wöchentlich messen.`});
    } else if (bsMode && m.ph<c.phMin){
      R.push({s:m.ph<c.phCritLow?'crit':'warn', t:'Kein pH-Minus mehr geben', a:'', d:m.ph<c.phCritLow?`pH unter ${fmt(c.phCritLow,1)} ist zu sauer (Korrosion, Hautreizung möglich). Auch beim Nachfüllen kein pH-Minus. Bundschuh/Armstark fragen – ggf. Alka-Plus zugeben.`:'Der pH ist unter dem Ziel. Beim nächsten Nachfüllen das pH-Minus weglassen und in ein paar Tagen erneut messen.'});
    } else if (m.ph>c.phMax){
      const g = Math.max(5, Math.round((m.ph-7.3)/0.1*c.phMinusGper01*V));
      R.push({s:m.ph>=c.phCrit?'crit':'warn', t:'pH-Minus zugeben', a:`ca. ${fmt(g)} g`, d:`Zielwert ca. 7,3. Erst die Hälfte (${fmt(Math.round(g/2))} g) bei laufenden Pumpen zugeben, nach 2 Stunden nachmessen und den Rest aus der Differenz abschätzen.`});
    } else if (m.ph<c.phMin){
      const g = Math.max(5, Math.round((7.2-m.ph)/0.1*c.phPlusGper01*V));
      R.push({s:m.ph<c.phCritLow?'crit':'warn', t:'pH-Plus zugeben', a:`ca. ${fmt(g)} g`, d:'Zielwert ca. 7,2. Erst die Hälfte zugeben, nach 2 Stunden nachmessen.'});
    }
  }
  // UltraShock = Chlordioxid (PoolLab: Parameter „Chlordioxid“)
  const cloudy = m.look==='leicht'||m.look==='trüb', smell = m.smell==='ja', green = m.look==='grün';
  if (m.clo2!=null){
    let s='ok', t='Desinfektion im Rahmen';
    if (m.clo2>c.usMax){ s='crit'; t=`über ${fmt(c.usMax)} mg/l – nicht baden`; }
    else if (m.clo2<c.usMin && (phase || cloudy || smell)){ s = m.clo2<0.1?'crit':'warn'; t='zu niedrig'; }
    else if (m.clo2<c.usMin){ s='warn'; t=`unter ${fmt(c.usMin,1)} mg/l`; }
    P.push({k:'clo2', l:'UltraShock (ClO₂)', v:fmt(m.clo2,2)+' mg/l', s, t});
    if (m.clo2>c.usMax) R.push({s:'crit', t:'Nicht baden', a:'', d:'Hautreizungen möglich. Abdeckung offen lassen, Pumpen laufen lassen und warten, bis der Wert unter 5 mg/l liegt.'});
  }
  const usLow = m.clo2!=null && m.clo2<c.usMin;
  if (cloudy || smell || green || (!bsMode && usLow && m.clo2<0.1)){
    const ml = round5(c.shockPer1000*V);
    R.push({s:'crit', t:'Schockbehandlung mit UltraShock', a:`${fmt(ml)} ml`, d:(bsMode?'Wasser auffällig – kurz mit Bundschuh absprechen. Übliche Schockbehandlung: ':'')+`${fmt(c.shockPer1000)} ml je 1.000 l bei laufenden Pumpen, mindestens 8 Stunden einwirken lassen. Baden erst, wenn der ClO₂-Wert unter 5 mg/l liegt. Filter reinigen. Bei Bedarf am Folgetag wiederholen.`});
  } else if (usLow && bsMode){
    R.push({s:'warn', t:'UltraShock kaum nachweisbar – beobachten', a:'', d:'Nach Bundschuh kein Nachdosieren, solange das Wasser klar ist und nicht riecht. Beim nächsten Messen wieder prüfen. Bleibt es so oder kommen Trübung, Geruch oder schmierige Wände dazu: mit Bundschuh absprechen.'});
  } else if (usLow && !bsMode){
    R.push({s:'warn', t:'UltraShock nachdosieren', a:`${fmt(c.usWeek)} ml`, d:`Ziel: mindestens ${fmt(c.usMin,1)} mg/l, gemessen am Tag nach der Zugabe${phase?' (wichtig in den ersten 2 Wochen)':''}.`});
  }
  if (cloudy) P.push({k:'look', l:'Wasserbild', v:m.look==='trüb'?'trüb':'leicht trüb', s:m.look==='trüb'?'crit':'warn', t:'Filter & UltraShock prüfen'});
  if (green) P.push({k:'look', l:'Wasserbild', v:'grünlich', s:'warn', t:'Filter & Dosierung prüfen'});
  if (m.look==='klar') P.push({k:'look', l:'Wasserbild', v:'klar', s:'ok', t:''});
  if (smell) P.push({k:'smell', l:'Geruch', v:'riecht', s:'warn', t:'Dosierung erhöhen'});
  if (m.bio==='ja'){
    P.push({k:'bio', l:'Wände/Filter', v:'schmierig', s:'warn', t:'Biofilm möglich'});
    R.push({s:'warn', t:'Schmieriger Belag', a:'', d:'Ein schmieriger Film an Wänden oder Filter deutet auf Biofilm (Bakterien) hin. Filter grundreinigen, Wände abwischen und mit Bundschuh absprechen, ob eine Schockbehandlung nötig ist.'});
  }
  if (m.urea!=null){
    const s = m.urea>pool.cfg.ureaMax*2?'crit':m.urea>pool.cfg.ureaMax?'warn':'ok';
    P.push({k:'urea', l:'Harnstoff', v:fmt(m.urea,2)+' mg/l', s, t:s==='ok'?'geringe Belastung':'viel Eintrag durch Badende'});
    if (s!=='ok') R.push({s, t:'Belastung durch Badende hoch', a:'', d:'Vor dem Baden duschen. Steigt der Wert weiter, ist ein Wasserwechsel sinnvoll.'});
  }
  if (m.foam==='ja'){
    P.push({k:'foam', l:'Schaum', v:'ja', s:'warn', t:''});
    R.push({s:'warn', t:'Schaum', a:'', d:'Filter reinigen, vor dem Baden duschen (Kosmetik/Waschmittelreste). Bleibt der Schaum trotz Pflege, ist ein Wasserwechsel fällig.'});
  }
  // Alkalinität
  if (m.ta!=null){
    const s = bsMode ? '' : rate(m.ta, c.taMin, c.taMax, 50, 180);
    if (bsMode){ P.push({k:'ta', l:'Alkalinität', v:fmt(m.ta)+' mg/l', s:'', t:'nur zur Kontrolle'}); } else {
    P.push({k:'ta', l:'Alkalinität', v:fmt(m.ta)+' mg/l', s, t:s==='ok'?`Ziel ${c.taMin}–${c.taMax}`:(m.ta<c.taMin?'zu niedrig – pH schwankt':'zu hoch – pH steigt')});
    if (m.ta<c.taMin){ const g=Math.max(5,Math.round((100-m.ta)/10*c.taPlusGper10*V));
      R.unshift({s:m.ta<50?'crit':'warn', t:'Alkalinität anheben (zuerst!)', a:`ca. ${fmt(g)} g Alka-Plus`, d:`Ziel ca. 100 mg/l. Mittel: „Alka-Plus“ (Natriumhydrogencarbonat) – ist nicht im SpaBalancer-Set, gibt es im Whirlpool-Fachhandel. Erst die Hälfte (${fmt(Math.round(g/2))} g) in einem Eimer Wasser auflösen und bei laufenden Pumpen zugeben, am nächsten Tag Alkalinität und pH neu messen. Den pH erst danach korrigieren – pH-Minus senkt die Alkalinität zusätzlich.`}); }
    if (m.ta>c.taMax) R.push({s:'warn', t:'Alkalinität senken', a:'', d:'Mit pH-Minus in kleinen Schritten senken, das senkt auch die Alkalinität.'});
  } }
  // Härte
  if (m.th!=null){
    const dh = dHfromMg(m.th), s = dh>c.hardMax+6?'crit':dh>c.hardMax?'warn':'ok';
    P.push({k:'th', l:'Gesamthärte', v:fmt(dh,1)+' °dH', s, t:s==='ok'?'weich':'hart'});
    if (dh>c.hardMax && !bsMode) R.push({s:'warn', t:'SoftWater verwenden', a:`${fmt(round5(50*V))} ml/Monat`, d:'Hartes Wasser fördert Kalk und Biofilm. SoftWater regelmäßig dosieren und den pH-Wert im Bereich halten.'});
  }
  if (m.temp!=null){
    const s = m.temp>40?'warn':'ok';
    P.push({k:'temp', l:'Temperatur', v:fmt(m.temp,1)+' °C', s, t:s==='ok'?'':'über 40 °C'});
  }
  if (R.some(r=>/UltraShock/.test(r.t)) ) R.push({s:'ok', t:'Abstand beachten', a:'', d:'Basic frühestens 3 Stunden nach UltraShock zugeben (und umgekehrt).'});
  if (!R.length && P.length) R.push({s:'ok', t:'Alles im grünen Bereich', a:'', d:bsMode?'Keine Zugabe nötig. Weiter nach Bundschuh-Plan (Wochendosis, beim Nachfüllen pH-Minus + SoftWater).':'Keine Zugabe nötig. Regelpflege laut Aufgabenliste fortführen.'});
  return {params:P, recs:R, status:worst(P.map(p=>p.s))};
}

function taskState(pool, t, now=Date.now()){
  const phase = startPhase(pool, now);
  let days = t.fixed ? t.days : (pool.cfg.intervals[t.k] ?? t.days);
  if (phase && t.start) days = Math.min(days, t.start);
  const last = pool.tasks[t.k] ? new Date(pool.tasks[t.k]).getTime() : null;
  if (!last) return {days, due:0, s:'warn', label:'noch nicht erledigt'};
  const due = Math.ceil((last + days*DAY - now)/DAY);
  const s = due<0 ? 'crit' : due<=1 ? 'warn' : 'ok';
  const label = due<0 ? `${-due} Tag${-due===1?'':'e'} überfällig` : due===0 ? 'heute fällig' : due===1 ? 'morgen fällig' : `in ${due} Tagen`;
  return {days, due, s, label};
}

function filterWear(pool, f, now=Date.now()){
  const c=pool.cfg;
  const age = f.since ? (now-new Date(f.since).getTime())/(30.44*DAY) : null;
  const rA = age!=null ? age/c.filterLifeMonths : 0, rC = f.cleanings/c.filterMaxClean;
  const r = Math.max(rA, rC);
  const s = r>=1 ? 'crit' : r>=0.8 ? 'warn' : 'ok';
  const why = r>=0.8 ? (rA>=rC ? `Alter ${fmt(age,0)} von ${c.filterLifeMonths} Monaten` : `${f.cleanings} von ${c.filterMaxClean} Reinigungen`) : '';
  return {age, r, s, why};
}

function migrate(s){
  for (const k of ['whirlpool','swimspa']){
    const d = defaultPool(k), p = s.pools?.[k] || {};
    s.pools = s.pools || {};
    s.pools[k] = {...d, ...p, cfg:{...d.cfg, ...(p.cfg||{}), intervals:{...d.cfg.intervals, ...(p.cfg?.intervals||{})}}};
    const q=s.pools[k];
    if (!q.filters) q.filters=d.filters;
    if (!q.germs) q.germs=[];
    q.cfg.bs = {...d.cfg.bs, ...(p.cfg?.bs||{})};
    if (!q.cfg.bs.v2){ q.cfg.bs.ctrlDays=7; q.cfg.bs.v2=1; } // wöchentliche Kontrolle (Wunsch 23.11.)
    q.filters.forEach(f=>{ if(f.useMs==null) f.useMs=0; if(f.rinses==null) f.rinses=0; if(f.status==='in' && !f.inAt) f.inAt=f.since||new Date().toISOString(); });
    if (k==='whirlpool' && !q.cfg.volConfirmed && q.cfg.vol===1300){ q.cfg.vol=1325; q.cfg.volConfirmed=true; if(q.name==='Whirlpool') q.name='Cameo'; if(!q.cfg.dosesCustom) Object.assign(q.cfg, defaultDoses('whirlpool',1325)); }
  }
  return s;
}
// Zwei Stände zusammenführen: Listen werden vereinigt, Einstellungen vom neueren Stand
function mergeState(srv, loc){
  if (!srv) return loc; if (!loc) return srv;
  if ((srv.epoch||'') !== (loc.epoch||'')) return srv; // Daten wurden neu gestartet: alter Gerätestand verfällt
  const newer = (loc.savedAt||'') >= (srv.savedAt||'') ? loc : srv, older = newer===loc ? srv : loc;
  const out = JSON.parse(JSON.stringify(newer));
  for (const k of Object.keys(out.pools||{})){
    const n=out.pools[k], o=older.pools?.[k]; if(!o) continue;
    const uni=(A,B,key)=>{ const m=new Map(); [...(B||[]),...(A||[])].forEach(x=>m.set(key(x),x)); return [...m.values()].sort((x,y)=>x.at<y.at?-1:1); };
    n.log = uni(n.log,o.log,x=>x.id||x.at).filter(x=>!(n.deleted||[]).includes(x.id));
    n.deletedDoses = [...new Set([...(n.deletedDoses||[]),...(o.deletedDoses||[])])].slice(-300);
    n.doses = uni(n.doses,o.doses,x=>x.at+'|'+x.what).filter(x=>!n.deletedDoses.includes(x.at+'|'+x.what)).slice(-400);
    n.baths = uni(n.baths,o.baths,x=>x.at).filter(x=>!n.deletedDoses.includes('bath|'+x.at)).slice(-300);
    { const m=new Map(); [...(o.germs||[]),...(n.germs||[])].forEach(g=>m.set(g.at+'|'+g.level,g)); n.germs=[...m.values()].sort((a,b)=>a.at<b.at?-1:1).slice(-100); }
    n.deleted = [...new Set([...(n.deleted||[]),...(o.deleted||[])])].slice(-200);
    n.log = n.log.filter(x=>!n.deleted.includes(x.id)).slice(-400);
    for (const t of Object.keys(o.tasks||{})) if (!n.tasks[t] || o.tasks[t]>n.tasks[t]) n.tasks[t]=o.tasks[t];
  }
  return out;
}
let renderPending=false;
function softRender(){ // bei Daten von anderen Geräten nicht neu aufbauen, solange ein Eingabefeld offen ist
  const a=document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ if(!renderPending){ renderPending=true; a.addEventListener('blur',()=>{ renderPending=false; setTimeout(render,0); },{once:true}); } return; }
  if (document.querySelector('#modal .modal')) return;
  render();
}
function setSync(t){ const el=document.getElementById('sync'); if(el) el.textContent=t; }
function keepLocal(){ try{ localStorage.setItem('spa-state', JSON.stringify(state)); localStorage.setItem('spa-dirty', dirty?'1':''); }catch(e){} }

function save(){
  state.savedAt=new Date().toISOString(); dirty=true; keepLocal();
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500);
}
async function flush(){
  if (!pb.authStore.isValid || !dirty) return;
  if (saving){ pendingSave=true; return; }
  saving=true; setSync('speichert …');
  try{
    let srv=null;
    try{ const r = await pb.collection('spa_state').getFirstListItem('key="main"'); recId=r.id; srv=r.data; }catch(e){ if(e.status!==404) throw e; }
    const merged = migrate(state._reset ? JSON.parse(JSON.stringify(state)) : mergeState(srv, state));
    let r;
    if (srv && (srv.epoch||'') !== (state.epoch||'') && !state._reset){ state=migrate(JSON.parse(JSON.stringify(srv))); dirty=false; keepLocal(); saving=false; softRender(); setSync('✓ aktuell'); return; }
    delete merged._reset;
    if (recId) r = await pb.collection('spa_state').update(recId, {data:merged});
    else { r = await pb.collection('spa_state').create({key:'main', data:merged}); recId=r.id; }
    const fin = migrate(JSON.parse(JSON.stringify(r.data||merged))); // Stand, wie ihn der Server gespeichert hat
    const changed = JSON.stringify(fin)!==JSON.stringify(state);
    state=fin; dirty=false; keepLocal(); setSync('✓ gespeichert');
    if (changed) softRender();
  }catch(e){ setSync(navigator.onLine?'nicht gespeichert – neuer Versuch folgt':'offline – wird nachgeholt'); }
  saving=false;
  if (pendingSave){ pendingSave=false; flush(); }
}
window.addEventListener('online', flush);
setInterval(()=>{ if(dirty) flush(); }, 30000);

async function loadServer(){
  setSync('lädt …');
  try{
    const r = await pb.collection('spa_state').getFirstListItem('key="main"'); recId=r.id;
    if ((r.data?.epoch||'') !== (state.epoch||'')) dirty=false;
    state = migrate(dirty ? mergeState(r.data, state) : JSON.parse(JSON.stringify(r.data)));
    keepLocal(); softRender(); setSync('✓ aktuell');
    if (dirty) flush();
  }catch(e){
    if (e.status===404){ dirty=true; flush(); } else setSync('offline – zeigt letzten Stand');
  }
  try{
    await pb.collection('spa_state').subscribe('*', ev=>{
      if (ev.action==='delete' || saving) return;
      if (dirty && (ev.record.data?.epoch||'')===(state.epoch||'')) return;
      if (JSON.stringify(ev.record.data)!==JSON.stringify(state)){ state=migrate(JSON.parse(JSON.stringify(ev.record.data))); recId=ev.record.id; keepLocal(); softRender(); }
    });
  }catch(e){}
}

function hygieneCard(p){
  if (!isBS(p)) return '';
  const now=Date.now(), items=[];
  const lastC = [...p.log].reverse().find(m=>m.clo2!=null);
  if (lastC){ const s = lastC.clo2<0.1 ? 'warn' : 'ok'; items.push({l:'Desinfektion (UltraShock)', v:fmt(lastC.clo2,2)+' mg/l', s, t:s==='ok'?'nachweisbar':'kaum noch nachweisbar', at:lastC.at}); }
  else items.push({l:'Desinfektion (UltraShock)', v:'–', s:'', t:'noch nicht gemessen'});
  const lastS = p.log[p.log.length-1];
  if (lastS){ const bad=[lastS.look&&lastS.look!=='klar'?'trüb/grünlich':'', lastS.smell==='ja'?'Geruch':'', lastS.foam==='ja'?'Schaum':'', lastS.bio==='ja'?'schmierig':''].filter(Boolean);
    items.push({l:'Aussehen & Geruch', v:bad.length?bad.join(', '):'unauffällig', s:bad.length?(bad.length>1||lastS.bio==='ja'?'crit':'warn'):'ok', t:'', at:lastS.at}); }
  const lastU = [...p.log].reverse().find(m=>m.urea!=null);
  if (lastU){ const s=lastU.urea>p.cfg.ureaMax*2?'crit':lastU.urea>p.cfg.ureaMax?'warn':'ok'; items.push({l:'Harnstoff', v:fmt(lastU.urea,2)+' mg/l', s, t:'Eintrag durch Badende', at:lastU.at}); }
  const lastG = p.germs[p.germs.length-1];
  if (lastG){ const old=(now-new Date(lastG.at))/DAY>p.cfg.germDays*2; items.push({l:'Keimtest', v:GERM[lastG.level][0], s:old?'warn':GERM[lastG.level][1], t:old?'veraltet – neu testen':'', at:lastG.at}); }
  else items.push({l:'Keimtest', v:'–', s:'', t:'noch keiner gemacht'});
  if (p.filledAt){ const age=Math.floor((now-new Date(p.filledAt))/DAY); items.push({l:'Wasseralter', v:`${age} Tage`, s:age>365?'crit':age>182?'warn':'ok', t:age>182?'Wasserwechsel fällig':''}); }
  const wk=p.baths.filter(b=>now-new Date(b.at)<7*DAY).reduce((a,b)=>a+b.persons,0);
  items.push({l:'Badende (7 Tage)', v:`${wk} Pers.`, s:'', t:''});
  const st=worst(items.map(i=>i.s));
  return `<div class="card"><h2>Hygiene-Check <span class="tag ${st==='none'?'':st}">${{ok:'unauffällig',warn:'beobachten',crit:'handeln',none:'–'}[st]}</span></h2>
   <p class="small" style="margin-top:0">Zusätzliche Sicherheit zu Bundschuhs Plan: Bakterien und Schmutz kann man nicht direkt sehen – diese Werte zeigen es indirekt.</p>
   <div class="tiles">${items.map(i=>`<div class="tile ${i.s}"><div class="l">${i.l}</div><div class="v" style="font-size:17px">${i.v}</div><div class="t">${i.t}${i.at?`<span class="small"> · ${dstr(i.at)}</span>`:''}</div></div>`).join('')}</div>
   ${st==='crit'||st==='warn'?`<p class="small" style="margin-bottom:0"><b>Was tun?</b> Filter grundreinigen, Wände abwischen, vor dem Baden duschen. Bleibt es auffällig: mit Bundschuh absprechen (Schockbehandlung oder Wasserwechsel). Unter „Hilfe“ stehen die Schritte.</p>`:''}</div>`;
}

function chart(log, key, band, yMin, yMax){
  const pts = log.filter(m=>m[key]!=null).slice(-30);
  if (pts.length<1) return '<p class="small">Noch keine Werte.</p>';
  const W=640,H=200,pl=36,pr=10,pt=10,pb=26;
  const vals=pts.map(m=>m[key]);
  const lo = yMin ?? Math.min(...vals, band[0]), hi = yMax ?? Math.max(...vals, band[1]*0.4, band[0]*2)*1.15;
  const t0=new Date(pts[0].at).getTime(), t1=Math.max(t0+DAY, new Date(pts[pts.length-1].at).getTime());
  const x=t=>pl+(new Date(t).getTime()-t0)/(t1-t0)*(W-pl-pr), y=v=>pt+(1-(Math.min(Math.max(v,lo),hi)-lo)/(hi-lo))*(H-pt-pb);
  const bTop=y(Math.min(band[1],hi)), bBot=y(Math.max(band[0],lo));
  const ticks=[lo,(lo+hi)/2,hi];
  const path=pts.map((m,i)=>(i?'L':'M')+x(m.at).toFixed(1)+','+y(m[key]).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
   <rect x="${pl}" y="${bTop}" width="${W-pl-pr}" height="${Math.max(0,bBot-bTop)}" fill="var(--okbg)"/>
   ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--mute)">${fmt(v,1)}</text>`).join('')}
   <path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2.5"/>
   ${pts.map(m=>`<circle cx="${x(m.at)}" cy="${y(m[key])}" r="4" fill="var(--brand)"/>`).join('')}

    ${ev.recs.map((r,i)=>{const act=r.s!=='ok'||r.a; return `<div class="rec">${act?`<input type="checkbox" data-wcheck="${i}" ${wiz.checks[i]?'checked':''} style="width:22px;height:22px;flex:none;margin-top:2px">`:`<span class="dot ${r.s}"></span>`}<div><b>${esc(r.t)}</b> ${r.a?`<span class="amt">${esc(r.a)}</span>`:''}<div class="small">${esc(r.d)}${howTo(r)}</div></div></div>`;}).join('')}
    </div>
    ${normCard({...wiz.v}, P())}
    <div class="card small"><b>Sicherheit:</b> Mittel nie miteinander mischen. Für jedes Mittel einen eigenen, sauberen Messbecher nehmen. Immer das Mittel ins Wasser geben, nie Wasser ins Mittel. Kinder dosieren nur zusammen mit einem Erwachsenen. Nach dem Dosieren Hände waschen.</div>
    ${wizBtns('Weiter zum Aufräumen')}`; }
  if (st===6) h=`<div class="card"><h2>7. Aufräumen</h2>
    ${step(1,'Küvette ausspülen','Mit klarem Wasser spülen, bis keine Farbe mehr zu sehen ist. Rückstände verfälschen die nächste Messung.')}
    ${step(2,'Gerät abtrocknen, nicht in die Sonne legen','')}
    ${step(3,'Tabletten trocken und verschlossen lagern','')}
    ${step(4,'Optional: Werte in die LabCOM-Cloud schicken','WiFi-Taste am PoolLab drücken.')}
    </div><button class="btn full" id="wFinish">Fertig ✓</button>`;
  return `${wizNav()}${h}`;
}
function howTo(r){
  if (/^pH-/.test(r.t)) return '<br><br><b>So geht’s:</b> Düsen einschalten. Menge abwiegen bzw. mit dem Messlöffel abmessen und langsam übers Wasser verteilen. Nach 2 Stunden neu messen (pH-Kammer reicht).';
  if (/UltraShock/.test(r.t)) return '<br><br><b>So geht’s:</b> Mit dem Messbecher abmessen und bei laufenden Pumpen ins Wasser geben.';
  return '';
}
function wizSave(){
  if (wiz.saved) return;

}
function wizFinish(){
  const p=P();
  (wiz.ev?.recs||[]).forEach((r,i)=>{ if (wiz.checks[i]) logDose(p, r.t, r.a); });

}

    const n=+t.dataset.bathok, ml=Math.max(10,5*n), p=P(), at=new Date().toISOString();
    p.baths.push({at, persons:n}); if(p.baths.length>300) p.baths.shift();
    p.doses.push({at, what:`UltraShock nach Bad (${n} Pers.)`, amount:`${ml} ml`, by:getWho()}); if(p.doses.length>400) p.doses.shift();
    closeModal(); save(); render(); toast('Eingetragen ✓');
  }
  else if (t.dataset.ddel && isAdmin()){
    if (t.dataset.sure!=='1'){ t.dataset.sure='1'; t.textContent='Löschen?'; return; }
    const p=P(), key=t.dataset.ddel, d=p.doses.find(x=>x.at+'|'+x.what===key);
    p.doses=p.doses.filter(x=>x.at+'|'+x.what!==key);
    p.deletedDoses=[...(p.deletedDoses||[]), key];
    if (d && /nach Bad/.test(d.what)){ p.baths=p.baths.filter(b=>b.at!==d.at); p.deletedDoses.push('bath|'+d.at); }
    save(); render(); toast('Eintrag gelöscht');
  }
  else if (t.dataset.del && isAdmin()){ const p=P(); p.log=p.log.filter(m=>m.id!==t.dataset.del); p.deleted=[...(p.deleted||[]),t.dataset.del]; save(); render(); }
});

initDb();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>

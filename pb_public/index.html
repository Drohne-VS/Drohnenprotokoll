<style>
/* Layout: Einsatzleitstand – feste Kopfleiste mit Reitern, darunter eine Arbeitsspalte (max. 1120px), Formulare in Abschnitten wie ein Vordruck */
:root {
  --bg: #EEF0EE;
  --surface: #FFFFFF;
  --sunken: #E4E7E5;
  --ink: #1A1E22;
  --muted: #5B656D;
  --line: #CDD2CF;
  --accent: #AF2B1E;        /* RAL 3000 Feuerrot */
  --accent-ink: #FFFFFF;
  --accent-soft: #F6E3E0;
  --chart: #1F4E79;         /* Lagekarten-Blau */
  --chart-soft: rgba(31,78,121,.14);
  --ok: #2E7048; --ok-soft: #E1F0E6;
  --warn: #9A6400; --warn-soft: #FBEFD6;
  --uebung: #1F4E79; --uebung-soft: #E1EAF3;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111417; --surface: #191D21; --sunken: #22272C; --ink: #E5E8E6; --muted: #98A2AA; --line: #2E353B;
  --accent: #E0533F; --accent-ink: #FFFFFF; --accent-soft: #3A1E1A; --chart: #7FB1DE; --chart-soft: rgba(127,177,222,.16);
  --ok: #6CC08C; --ok-soft: #1B3326; --warn: #E2AE52; --warn-soft: #3A2E15; --uebung: #8DB8E3; --uebung-soft: #1C2C3D;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111417; --surface: #191D21; --sunken: #22272C; --ink: #E5E8E6; --muted: #98A2AA; --line: #2E353B;
  --accent: #E0533F; --accent-ink: #FFFFFF; --accent-soft: #3A1E1A; --chart: #7FB1DE; --chart-soft: rgba(127,177,222,.16);
  --ok: #6CC08C; --ok-soft: #1B3326; --warn: #E2AE52; --warn-soft: #3A2E15; --uebung: #8DB8E3; --uebung-soft: #1C2C3D;
  color-scheme: dark; }

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.who { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.who-n { display: grid; font-weight: 600; font-size: 13.5px; line-height: 1.15; text-align: right; }
.who-n small { font-weight: 400; color: var(--muted); font-size: 12px; }
.auth { max-width: 420px; margin: 6vh auto 0; width: 100%; }
.auth form { display: grid; gap: 14px; }
.auth button[type="submit"] { justify-content: center; padding: 12px; font-size: 15px; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in, .main { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; padding-block: 10px 0; }
.brand { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; border-radius: 8px; }
.brand-logo { height: 40px; width: auto; max-width: 120px; flex: none; object-fit: contain; }
.logo-box { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.logo-prev { width: 96px; height: 96px; border: 1px dashed var(--line); border-radius: var(--r); display: grid; place-items: center; background: var(--bg); overflow: hidden; }
.logo-prev img { max-width: 88px; max-height: 88px; object-fit: contain; }
.brand-t { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand-s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 100%; flex-basis: 100%; }
.tab { font-family: var(--f-display); font-weight: 600; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 8px 12px 10px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--chart); outline-offset: 2px; }

.main { padding-block: 22px 60px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 30px; letter-spacing: .01em; }
h2 { font-size: 19px; letter-spacing: .05em; text-transform: uppercase; }
h3 { font-size: 16px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head .sub { color: var(--muted); margin-top: 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

button, .btn { font: 600 14px/1 var(--f-body); border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover { filter: brightness(1.08); }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.sec { padding: 18px 20px; display: grid; gap: 14px; }
.sec + .sec { border-top: 1px solid var(--line); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sec-h h2 { display: flex; align-items: baseline; gap: 10px; }
.sec-h h2 .k { font-family: var(--f-mono); font-size: 12px; color: var(--accent); letter-spacing: 0; }

.grid { display: grid; gap: 12px 14px; grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr)); }
.grid .w2 { grid-column: span 2; }
.grid .wf { grid-column: 1 / -1; }
@media (max-width: 520px) { .grid .w2 { grid-column: 1 / -1; } }
.grid > * { min-width: 0; }
/* iPhone/iPad: Datums- und Zeitfelder haben dort eine feste Eigenbreite und ragen sonst ins Nachbarfeld */
@supports (-webkit-touch-callout: none) {
  input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; display: block; min-height: 2.45em; max-width: 100%; }
  input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value { text-align: left; }
}
label.f { display: grid; gap: 4px; min-width: 0; }
label.f > span { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input, select, textarea { font: 400 15px/1.3 var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 8px 9px; width: 100%; min-width: 0; }
textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
input[type="time"], input[type="date"], input.mono { font-family: var(--f-mono); font-size: 14px; }
input:disabled, select:disabled, textarea:disabled { opacity: .85; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--surface); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.chip { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px 3px; border-radius: 3px; white-space: nowrap; }
.chip.einsatz { background: var(--accent-soft); color: var(--accent); }
.chip.uebung { background: var(--uebung-soft); color: var(--uebung); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.neutral { background: var(--sunken); color: var(--muted); }
.chip.bad { background: var(--accent-soft); color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.gruen { background: var(--ok); } .dot.gelb { background: var(--warn); } .dot.rot { background: var(--accent); } .dot.keine { background: var(--line); }
.plink { color: inherit; text-decoration: none; font-weight: 600; }
.plink:hover { color: var(--accent); text-decoration: underline; }
.rule-in { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rule-in input { width: 70px; text-align: center; }
.routine-legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.routine-legend span { display: inline-flex; gap: 6px; align-items: center; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { font: 600 12.5px/1.2 var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.link { cursor: pointer; }
tbody tr.link:hover { background: var(--sunken); }
tfoot td { font-weight: 600; border-top: 2px solid var(--ink); border-bottom: 0; }

.mlist { display: grid; }
.mrow { display: grid; grid-template-columns: 92px 1fr auto; gap: 4px 16px; padding: 13px 18px; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; border-radius: 0; width: 100%; font: inherit; color: inherit; align-items: center; }
.mrow:last-child { border-bottom: 0; }
.mrow:hover { background: var(--sunken); border-color: var(--line); }
.mrow .d { font-family: var(--f-mono); font-size: 13px; line-height: 1.3; }
.mrow .d b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: .01em; }
.mrow .t { min-width: 0; }
.mrow .t strong { font-weight: 600; font-size: 16px; display: block; overflow-wrap: anywhere; }
.mrow .t .meta { color: var(--muted); font-size: 13.5px; display: flex; gap: 6px 12px; flex-wrap: wrap; margin-top: 2px; }
.mrow .k { text-align: right; display: grid; gap: 4px; justify-items: end; }
.mrow .k .ft { font-family: var(--f-mono); font-size: 14px; }
@media (max-width: 560px) { .mrow { grid-template-columns: 70px 1fr; } .mrow .k { grid-column: 2; justify-items: start; text-align: left; display: flex; gap: 8px; align-items: center; } }

.empty { padding: 34px 22px; display: grid; gap: 10px; justify-items: start; }
.empty h3 { color: var(--ink); }
.empty p { color: var(--muted); max-width: 60ch; }

.banner { border-radius: var(--r); padding: 11px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); }
.banner.info { background: var(--sunken); color: var(--ink); }

/* Positionen + Skizze */
.posgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .posgrid { grid-template-columns: minmax(0, 1fr); } }
.pos { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.pos-top { display: grid; grid-template-columns: 34px 150px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
@media (max-width: 520px) { .pos-top { grid-template-columns: 34px minmax(0,1fr) auto; } .pos-top .pl { grid-column: 1 / -1; } }
.sym { width: 30px; height: 30px; display: grid; place-items: center; font: 700 13px/1 var(--f-display); border-radius: 4px; color: #fff; }
.pos-coord { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.pos-out { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); display: flex; gap: 4px 14px; flex-wrap: wrap; }
.pos-out .err { color: var(--accent); font-family: var(--f-body); }
.pos-out a { color: var(--chart); }
.sketch { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.sketch canvas { display: block; width: 100%; height: 360px; touch-action: manipulation; }
.sketch-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--bg); font-size: 13px; }
.sketch-bar select { width: auto; padding: 5px 7px; font-size: 13px; }

/* Flüge */
.flight { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); display: grid; }
.flight-h { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.flight-h .fn { font: 700 18px/1 var(--f-display); letter-spacing: .03em; }
.flight-h .dur { margin-left: auto; font-family: var(--f-mono); font-size: 15px; font-weight: 500; }
.flight-b { padding: 12px; display: grid; gap: 12px; }
.crew { display: grid; gap: 6px; }
.crew-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; }
.slot { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 4px 10px; align-items: center; }
.slot .sl { font: 600 14px/1.15 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.slot .sl small { display: block; font: 400 12px/1.3 var(--f-body); text-transform: none; letter-spacing: 0; color: var(--muted); }
@media (max-width: 520px) { .slot { grid-template-columns: minmax(0, 1fr); } }
.crew-note { font-size: 13px; color: var(--muted); }
.crew-note.warn { color: var(--warn); font-weight: 600; }
.log { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.log-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); align-items: baseline; background: var(--surface); }
.log-row:last-child { border-bottom: 0; }

.log-row .tx { overflow-wrap: anywhere; }
.log-row .tx .tag { font: 600 11.5px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.log-in { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 8px; }
@media (max-width: 520px) { .log-in { grid-template-columns: 96px minmax(0, 1fr); } .log-in button { grid-column: 1 / -1; } }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.quick button.go, .quick button.stop { font-size: 16px; padding: 12px 18px; }
.mbar { display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: var(--sunken); vertical-align: middle; margin-left: 6px; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--line); }
.mbar i.ok { background: var(--ok); } .mbar i.warn { background: var(--warn); }
.wx { display: flex; gap: 10px 22px; flex-wrap: wrap; }
.wx-g { display: grid; gap: 5px; }
.wx-l { font: 600 13px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pick { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.melde { display: grid; gap: 6px; }
.mlist2 { display: grid; gap: 8px; }
.mm { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.mm.open { border-color: var(--chart); background: var(--surface); }

.mm-n { display: grid; gap: 3px; min-width: 0; }
.mm-n b { font-weight: 600; font-size: 15px; }
.mm-n .muted { font-size: 13px; }
.mm-a { display: flex; flex-wrap: wrap; gap: 4px; }
.tag2 { font-size: 11.5px; padding: 2px 7px; border-radius: 10px; background: var(--uebung-soft); color: var(--uebung); font-weight: 600; }
.mm-c { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
.mm-x { font-size: 13px; color: var(--chart); font-weight: 600; white-space: nowrap; }
.mm-b { padding: 0 12px 12px; display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.nw { display: grid; gap: 6px; }
.nw-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.nw-i { font: 700 11px/1 var(--f-display); letter-spacing: .06em; padding: 4px 6px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); }
.nw-r a { color: var(--chart); font-weight: 600; overflow-wrap: anywhere; }
.kr-sum { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--muted); }
.kr-sum b { color: var(--ink); font-size: 17px; font-family: var(--f-display); }
.kr { display: grid; gap: 8px; }

@media (max-width: 640px) { .kr-row { grid-template-columns: minmax(0, 1fr) auto; } .kr-o { grid-column: 1 / -1; } }
.kr-n { display: grid; gap: 5px; justify-items: start; min-width: 0; }
.kr-o { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.kr-o select { width: auto; flex: 1 1 160px; }
.kr-t { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kr-t input[type="time"] { width: 7.2em; padding: 5px 6px; }
.kr-row.entl { opacity: .72; }

@media (max-width: 520px) { .melde-g { grid-template-columns: minmax(0, 1fr); } }
.melde-t { position: relative; display: grid; }

.mt { display: grid; gap: 2px; min-width: 0; }
.mn { font-weight: 600; line-height: 1.2; }
.mtel { font: 400 13px/1.2 var(--f-mono); color: var(--muted); }

.chk { gap: 10px; font-weight: 600; background: var(--bg); padding: 9px 14px 9px 10px; }

      - (35 * e2 ** 3 / 3072) * Math.sin(6 * p));

    let n = k0 * (M + N * t * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));

    const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  return { toUTM, fromUTM, toMGRS, fromMGRS, parse, dist };
})();

async function saveDraft(then, silent) {
  if (!S.draft || ro()) return;
  clearTimeout(autoT);
  const d = stripLocal(clone(S.draft)); const id = d.id;
  (d.positions || []).forEach(p => { if (!isFinite(p.lat) || p.lat === null) { p.lat = null; p.lon = null; } });
  const { typ, status, datum } = d;
  ["id", "typ", "status", "datum", "updatedAt", "protokoll"].forEach(k => delete d[k]);
  const wasNew = S.draft._new;
  S.lastSaved = { id, data: JSON.stringify(d) };
  await Store.upsert("missions", id, { typ: typ === "uebung" ? "uebung" : "einsatz", status: status === "abgeschlossen" ? "abgeschlossen" : "entwurf", datum: datum || "", data: d });
  delete S.draft._new; delete S.draft._hash;
  S.dirty = false; S.remoteChanged = false;
  S.baseStamp = (S.missions.find(m => m.id === id) || {}).updatedAt || S.baseStamp;
  if (then) { S.pendingHash = null; location.hash = then; return; }
  if (wasNew) { ignoreHash = true; location.hash = "e-" + id; }
  S.savedAt = nowTime(); S.autoSaved = !!silent;
  if (silent) { actions(); return; }
  toast(S.online ? "Gespeichert" : "Auf dem Gerät gespeichert");
  render();
}

function act(a, b) {
  const d = S.draft;
  switch (a) {
    case "new": location.hash = b.dataset.typ === "uebung" ? "neu-uebung" : "neu-einsatz"; break;
    case "open": location.hash = "e-" + b.dataset.id; break;
    case "ftyp": S.filter.typ = b.dataset.v; render(); break;
    case "save": saveDraft(); break;
    case "reload": { const m = S.missions.find(x => x.id === d.id); if (m) { loadDraft(m); render(); } break; }
    case "discard": { const h = S.pendingHash; S.dirty = false; S.pendingHash = null; S.draft = null; location.hash = h; break; }
    case "stay": S.pendingHash = null; actions(); break;
    case "delete": S.confirm = "delete"; actions(); break;
    case "nodelete": S.confirm = null; actions(); break;
    case "dodelete": { const id = d.id; S.dirty = false; S.draft = null; S.confirm = null; Store.del("missions", id); toast("Bericht gelöscht"); location.hash = "einsaetze"; break; }
    case "close": {
      const fs0 = flugState(d);
      if (fs0 === "luft" || fs0 === "pause") { toast(fs0 === "luft" ? "Die Drohne ist laut Protokoll noch in der Luft. Bitte erst landen und „■ Flug beenden“ tippen." : "Der Flug ist noch nicht beendet (Akkuwechsel). Bitte im Protokoll „■ Flug beenden“ tippen."); const el = document.querySelector("[data-act=logland]"); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
      const miss = (d.flights || []).findIndex(f => !(f.crew || []).some(c => c.role === "pilot" && c.memberId));
      if (miss >= 0) { toast(`Im Flugverlauf fehlt ein Pilot (Abschnitt ${miss + 1}). Bitte eintragen, dann abschließen.`); const el = document.getElementById("flight-" + miss); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
      S.confirm = "close"; actions(); break;
    }
    case "doclose": S.confirm = null; d.status = "abgeschlossen"; if (!d.ende) d.ende = nowTime(); saveDraft(isTablet() ? "einsaetze" : undefined).then(() => toast("Bericht abgeschlossen")); break;
    case "reopen": d.status = "entwurf"; saveDraft(); break;
    case "logout": S.confirm = "logout"; header(); break;
    case "dologout": S.confirm = null; logout(); break;
    case "logfix": { const x = S.protokoll.find(y => y.id === b.dataset.id); const tx = $("#logText"); if (x && tx) { tx.value = `Korrektur zu ${x.zeit}: `; tx.focus(); tx.setSelectionRange(tx.value.length, tx.value.length); } break; }
    case "setpw": {

      pb.collection("users").update(b.dataset.id, { password: pw, passwordConfirm: pw }).then(() => { toast("Passwort geändert"); inp.value = ""; if (b.dataset.id === (me() || {}).id) logout(true); }, e => toast("Passwort konnte nicht geändert werden" + (e.status ? " (" + e.status + ")" : "") + "."));
      break;
    }
    case "adduser": {
      const u = $("#nu-user").value.trim().toLowerCase(), n = $("#nu-name").value.trim(), r = $("#nu-role").value, p = $("#nu-pass").value;
      if (!/^[a-z0-9._-]{3,40}$/.test(u)) { toast("Benutzername: 3–40 Zeichen, nur Kleinbuchstaben, Ziffern, Punkt, Minus."); return; }
      if (p.length < 10) { toast("Das Passwort braucht mindestens 10 Zeichen."); return; }
      pb.collection("users").create({ username: u, name: n, role: r, password: p, passwordConfirm: p, verified: true })
        .then(() => { toast("Zugang „" + u + "“ angelegt"); S.users = null; render(); }, e => toast(e.response && e.response.data && e.response.data.username ? "Diesen Benutzernamen gibt es schon." : "Zugang konnte nicht angelegt werden."));
      break;
    }
    case "deluser": S.confirm = null; pb.collection("users").delete(b.dataset.id).then(() => { toast("Zugang gelöscht"); S.users = null; render(); }, () => toast("Zugang konnte nicht gelöscht werden.")); break;
    case "addpos": {

      markDirty(); render(); const i = d.positions.length - 1; const el = document.getElementById(`p-${i}-c`); if (el) el.focus(); break;

    case "ort": { const t = d.team[+b.dataset.i]; if (!t) return; t.ort = b.dataset.v; S.dirty = true; saveDraft(); break; }
    case "delteam": d.team.splice(+b.dataset.i, 1); markDirty(); render(); break;
    case "teamfromcrew": {

    }
    case "delflight": d.flights.splice(+b.dataset.i, 1); markDirty(); render(); break;
    case "logstart": {
      const prev = d.flights[d.flights.length - 1];
      { const dx = S.drones.find(x => x.id === ((prev && prev.droneId) || d.droneId)); if (dx && dx.ausserBetrieb) { toast(`${dx.name} ist außer Betrieb und darf nicht fliegen. Bitte unter „Flug & Crew“ eine andere Drohne wählen.`); return; } }
      const crew0 = d.nextCrew || (prev ? prev.crew || [] : []);
      let pilot = (crew0.find(c => c.role === "pilot" && c.memberId) || {}).memberId || "";

    }
    case "akku": { const t = nowTime(), f = d.flights[d.flights.length - 1]; f.landung = t; f.pause = true; S.dirty = true; logPush("Gelandet für Akkuwechsel", "Akku", t); break; }
    case "resume": {

      const sw = !!d.nextCrew && (crew.find(c => c.role === "pilot") || {}).memberId !== ((prev.crew || []).find(c => c.role === "pilot") || {}).memberId;
      d.flights.push({ id: uid("f"), droneId: prev.droneId, start: t, landung: "", akkus: "1", crew, bemerkung: "", wechsel: sw || undefined });
      delete d.nextCrew; S.dirty = true; logPush("Wieder gestartet mit neuem Akku", "Start", t); break;
    }
    case "nostart": S.askPilot = null; render(); break;
    case "auftrag": S.askAuftrag = { modus: "", text: "" }; S.askSwap = false; S.askPilot = null; render(); { const el = $("#auftragText"); if (el) el.focus(); } break;
    case "amodus": { const tx = $("#auftragText"); S.askAuftrag.text = tx ? tx.value : ""; S.askAuftrag.modus = S.askAuftrag.modus === b.dataset.v ? "" : b.dataset.v; render(); break; }

async function pdfImage(url) {
  if (!url) return null;

    const res = await fetch(url); if (!res.ok) return null;
    const blob = await res.blob(); const u = URL.createObjectURL(blob);
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = u; });
    const k = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(u);
    return { data: cv.toDataURL("image/jpeg", 0.8), w: cv.width, h: cv.height };
  } catch (e) { return null; }
}
async function loadLogo() {

    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const cv = document.createElement("canvas"); const k = Math.min(1, 600 / Math.max(img.width, img.height));
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);

    return { data: cv.toDataURL("image/jpeg", .92), w: cv.width, h: cv.height };
  } catch (e) { return null; }
}

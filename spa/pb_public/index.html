<style>
:root{
  --bg:#f3f7fa;--card:#fff;--ink:#0f2433;--mute:#5d7282;--line:#dde6ec;
  --brand:#0b6e99;--brand2:#e3f2f9;

@media (prefers-color-scheme:dark){

  --ok:#4cc27e;--okbg:#143326;--warn:#f0a83a;--warnbg:#3a2c12;--crit:#ff6b5e;--critbg:#3d1a17;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line)}

.pools{display:flex;gap:6px}
.pools button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600}

.status{display:flex;align-items:center;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.ok .dot,.dot.ok{background:var(--ok)}.warn .dot,.dot.warn{background:var(--warn)}.crit .dot,.dot.crit{background:var(--crit)}.none .dot,.dot.none{background:var(--line)}
.status.ok{background:var(--okbg)}.status.warn{background:var(--warnbg)}.status.crit{background:var(--critbg)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}

.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.crit{background:var(--critbg);color:var(--crit)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:150px;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}

td.c-ok{color:var(--ok)}td.c-warn{color:var(--warn)}td.c-crit{color:var(--crit);font-weight:600}

<body>
<header>
  <h1>💧 Spa-Wasserpflege <span class="sync" id="sync">lädt …</span></h1>
  <div class="pools" id="pools"></div>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"></div>

<script>
/* ================= Fachlogik =================
   Quelle Dosierung/Ablauf: SpaBalancer-Wasserpflegeanleitungen (Hartschalen-Whirlpools / Swim Spas).
   Werte sind Voreinstellungen – maßgeblich ist immer das Produktetikett. */

const DAY = 864e5;
const fmt = (n, d=0) => (n==null||isNaN(n)) ? '–' : Number(n).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const round5 = ml => Math.max(5, Math.round(ml/5)*5);
const dHfromMg = mg => mg/17.85;

function interp(points, v){
  const p = [...points].sort((a,b)=>a[0]-b[0]);
  if (v <= p[0][0]) { const [a,b]=[p[0],p[1]]; return a[1]+(v-a[0])*(b[1]-a[1])/(b[0]-a[0]); }
  for (let i=1;i<p.length;i++) if (v<=p[i][0]) { const a=p[i-1],b=p[i]; return a[1]+(v-a[0])*(b[1]-a[1])/(b[0]-a[0]); }
  const a=p[p.length-2],b=p[p.length-1]; return b[1]+(v-b[0])*(b[1]-a[1])/(b[0]-a[0]);
}
// SpaBalancer-Tabelle Hartschalen-Whirlpool (wöchentlich)
const WP_US = [[500,30],[1000,40],[1300,50],[1600,60]];
const WP_BASIC = [[500,40],[1000,50],[1300,60],[1600,70]];

function defaultDoses(type, vol){
  if (type==='whirlpool') return { usWeek: round5(interp(WP_US,vol)), basicWeek: round5(interp(WP_BASIC,vol)) };
  // Swim-Spa: UltraShock 80–200 ml bei 4.000–10.000 l (20 ml je 1.000 l); Basic-Tabelle nicht lesbar -> leer lassen
  return { usWeek: round5(vol/1000*20), basicWeek: null };
}

const TASKS = [
  {k:'ph',     name:'pH-Wert messen',                     days:7,   start:1,  note:'Im Regelbetrieb 1× pro Woche, nach Neubefüllung 1–2× täglich.'},
  {k:'weekly', name:'Wochendosis Basic + UltraShock',     days:7,   note:'Zwischen UltraShock und Basic mindestens 3 Stunden Abstand.'},
  {k:'filter', name:'Filter tauschen & reinigen',         days:14,  start:7,  note:'Sauberen Filter einsetzen, den alten mit Filterbrause und Filterreiniger säubern. Alle 1–2 Wochen, nach Neubefüllung 1–2× pro Woche.'},
  {k:'soft',   name:'SoftWater (monatlich)',              days:30,  note:'50 ml je 1.000 l, beim Nachfüllen anteilig.'},
  {k:'cover',  name:'Abdeckung reinigen / prüfen',        days:30,  note:'Unterseite auf muffigen Geruch prüfen.'},
  {k:'change', name:'Wasserwechsel + Grundreinigung',     days:182, note:'Idealerweise alle 6, spätestens alle 12 Monate. Vorher Grundreinigung mit SystemFlush, danach Neubefüllung starten.'},
];

function defaultPool(type){
  const vol = type==='whirlpool'?1325:8000;
  return {
    type, active: type==='whirlpool',
    name: type==='whirlpool'?'Cameo':'Swim-Spa',
    cfg: {
      vol, volConfirmed: type==='whirlpool',
      filterLifeMonths:12, filterMaxClean:25,
      ...defaultDoses(type, vol), dosesCustom:false,
      shockPer1000: 50,          // Schockbehandlung ml je 1.000 l (8 h einwirken)
      phMinusGper01: 10,         // g pH-Minus je 0,1 pH je 1.000 l (Etikett!)
      phPlusGper01: 10,
      phMin:6.8, phMax:7.8, phCrit:8.0, phCritLow:6.5,
      usMin:0.3, usMax:5,
      taMin:80, taMax:120,
      hardMax:12,
      intervals: Object.fromEntries(TASKS.map(t=>[t.k,t.days])),
    },
    filledAt:null,
    tasks:{},          // k -> ISO zuletzt erledigt
    filters: type==='whirlpool' ? [1,2,3].map(n=>({n, status:n===1?'in':'spare', since:null, cleanings:0, lastClean:null, uses:0})) : [],
    log:[],            // Messungen
    baths:[],          // {at, persons}
    doses:[],          // {at, what, amount}
  };
}

function startPhase(pool, now=Date.now()){
  if(!pool.filledAt) return null;
  const d = Math.floor((now - new Date(pool.filledAt).getTime())/DAY)+1;
  return d>=1 && d<=14 ? d : null;
}

function rate(val, okLo, okHi, critLo, critHi){
  if (val==null||isNaN(val)) return null;
  if ((critLo!=null && val<critLo) || (critHi!=null && val>critHi)) return 'crit';
  if ((okLo!=null && val<okLo) || (okHi!=null && val>okHi)) return 'warn';
  return 'ok';
}
const worst = arr => arr.includes('crit')?'crit':arr.includes('warn')?'warn':arr.some(Boolean)?'ok':'none';

function evaluate(m, pool, now=Date.now()){
  const c = pool.cfg, V = c.vol/1000, phase = startPhase(pool, now);
  const P = [], R = [];
  // pH
  if (m.ph!=null){
    const s = rate(m.ph, c.phMin, c.phMax, c.phCritLow, c.phCrit-0.0001);
    P.push({k:'ph', l:'pH-Wert', v:fmt(m.ph,2), s, t: s==='ok'?`Ziel ${fmt(c.phMin,1)}–${fmt(c.phMax,1)}` : m.ph>c.phMax ? (m.ph>=c.phCrit?'zu hoch – Kalkausfall möglich':'leicht zu hoch') : 'zu niedrig'});
    if (m.ph>c.phMax){
      const g = Math.max(5, Math.round((m.ph-7.3)/0.1*c.phMinusGper01*V));
      R.push({s:m.ph>=c.phCrit?'crit':'warn', t:'pH-Minus zugeben', a:`ca. ${fmt(g)} g`, d:`Zielwert ca. 7,3. Erst die Hälfte (${fmt(Math.round(g/2))} g) bei laufenden Pumpen zugeben, nach 2 Stunden nachmessen und den Rest aus der Differenz abschätzen.`});
    } else if (m.ph<c.phMin){
      const g = Math.max(5, Math.round((7.2-m.ph)/0.1*c.phPlusGper01*V));
      R.push({s:m.ph<c.phCritLow?'crit':'warn', t:'pH-Plus zugeben', a:`ca. ${fmt(g)} g`, d:'Zielwert ca. 7,2. Erst die Hälfte zugeben, nach 2 Stunden nachmessen.'});
    }
  }
  // UltraShock = Chlordioxid (PoolLab: Parameter „Chlordioxid“)
  const cloudy = m.look==='leicht'||m.look==='trüb', smell = m.smell==='ja', green = m.look==='grün';
  if (m.clo2!=null){
    let s='ok', t='Desinfektion im Rahmen';
    if (m.clo2>c.usMax){ s='crit'; t=`über ${fmt(c.usMax)} mg/l – nicht baden`; }
    else if (m.clo2<c.usMin && (phase || cloudy || smell)){ s = m.clo2<0.1?'crit':'warn'; t='zu niedrig'; }
    else if (m.clo2<c.usMin){ s='warn'; t=`unter ${fmt(c.usMin,1)} mg/l`; }
    P.push({k:'clo2', l:'UltraShock (ClO₂)', v:fmt(m.clo2,2)+' mg/l', s, t});
    if (m.clo2>c.usMax) R.push({s:'crit', t:'Nicht baden', a:'', d:'Hautreizungen möglich. Abdeckung offen lassen, Pumpen laufen lassen und warten, bis der Wert unter 5 mg/l liegt.'});
  }
  const usLow = m.clo2!=null && m.clo2<c.usMin;
  if (cloudy || smell || green || (usLow && m.clo2<0.1)){
    const ml = round5(c.shockPer1000*V);
    R.push({s:'crit', t:'Schockbehandlung mit UltraShock', a:`${fmt(ml)} ml`, d:`${fmt(c.shockPer1000)} ml je 1.000 l bei laufenden Pumpen, mindestens 8 Stunden einwirken lassen. Baden erst, wenn der ClO₂-Wert unter 5 mg/l liegt. Filter reinigen. Bei Bedarf am Folgetag wiederholen.`});
  } else if (usLow){
    R.push({s:'warn', t:'UltraShock nachdosieren', a:`${fmt(c.usWeek)} ml`, d:`Ziel: mindestens ${fmt(c.usMin,1)} mg/l, gemessen am Tag nach der Zugabe${phase?' (wichtig in den ersten 2 Wochen)':''}.`});
  }
  if (cloudy) P.push({k:'look', l:'Wasserbild', v:m.look==='trüb'?'trüb':'leicht trüb', s:m.look==='trüb'?'crit':'warn', t:'Filter & UltraShock prüfen'});
  if (green) P.push({k:'look', l:'Wasserbild', v:'grünlich', s:'warn', t:'Filter & Dosierung prüfen'});
  if (m.look==='klar') P.push({k:'look', l:'Wasserbild', v:'klar', s:'ok', t:''});
  if (smell) P.push({k:'smell', l:'Geruch', v:'riecht', s:'warn', t:'Dosierung erhöhen'});
  if (m.foam==='ja'){
    P.push({k:'foam', l:'Schaum', v:'ja', s:'warn', t:''});
    R.push({s:'warn', t:'Schaum', a:'', d:'Filter reinigen, vor dem Baden duschen (Kosmetik/Waschmittelreste). Bleibt der Schaum trotz Pflege, ist ein Wasserwechsel fällig.'});
  }
  // Alkalinität
  if (m.ta!=null){
    const s = rate(m.ta, c.taMin, c.taMax, 50, 180);
    P.push({k:'ta', l:'Alkalinität', v:fmt(m.ta)+' mg/l', s, t:s==='ok'?`Ziel ${c.taMin}–${c.taMax}`:(m.ta<c.taMin?'zu niedrig – pH schwankt':'zu hoch – pH steigt')});
    if (m.ta<c.taMin) R.push({s:'warn', t:'Alkalinität anheben', a:'', d:'Mit Alkalinitäts-Plus nach Etikett. Danach pH erneut prüfen.'});
    if (m.ta>c.taMax) R.push({s:'warn', t:'Alkalinität senken', a:'', d:'Mit pH-Minus in kleinen Schritten senken, das senkt auch die Alkalinität.'});
  }
  // Härte
  if (m.th!=null){
    const dh = dHfromMg(m.th), s = dh>c.hardMax+6?'crit':dh>c.hardMax?'warn':'ok';
    P.push({k:'th', l:'Gesamthärte', v:fmt(dh,1)+' °dH', s, t:s==='ok'?'weich':'hart'});
    if (dh>c.hardMax) R.push({s:'warn', t:'SoftWater verwenden', a:`${fmt(round5(50*V))} ml/Monat`, d:'Hartes Wasser fördert Kalk und Biofilm. SoftWater regelmäßig dosieren und den pH-Wert im Bereich halten.'});
  }
  if (m.temp!=null){
    const s = m.temp>40?'warn':'ok';
    P.push({k:'temp', l:'Temperatur', v:fmt(m.temp,1)+' °C', s, t:s==='ok'?'':'über 40 °C'});
  }
  if (R.some(r=>/UltraShock/.test(r.t)) ) R.push({s:'ok', t:'Abstand beachten', a:'', d:'Basic frühestens 3 Stunden nach UltraShock zugeben (und umgekehrt).'});
  if (!R.length && P.length) R.push({s:'ok', t:'Alles im grünen Bereich', a:'', d:'Keine Zugabe nötig. Regelpflege laut Aufgabenliste fortführen.'});
  return {params:P, recs:R, status:worst(P.map(p=>p.s))};
}

function taskState(pool, t, now=Date.now()){
  const phase = startPhase(pool, now);
  let days = pool.cfg.intervals[t.k] ?? t.days;
  if (phase && t.start) days = Math.min(days, t.start);
  const last = pool.tasks[t.k] ? new Date(pool.tasks[t.k]).getTime() : null;
  if (!last) return {days, due:0, s:'warn', label:'noch nicht erledigt'};
  const due = Math.ceil((last + days*DAY - now)/DAY);
  const s = due<0 ? 'crit' : due<=1 ? 'warn' : 'ok';
  const label = due<0 ? `${-due} Tag${-due===1?'':'e'} überfällig` : due===0 ? 'heute fällig' : due===1 ? 'morgen fällig' : `in ${due} Tagen`;
  return {days, due, s, label};
}

function filterWear(pool, f, now=Date.now()){
  const c=pool.cfg;
  const age = f.since ? (now-new Date(f.since).getTime())/(30.44*DAY) : null;
  const rA = age!=null ? age/c.filterLifeMonths : 0, rC = f.cleanings/c.filterMaxClean;
  const r = Math.max(rA, rC);
  const s = r>=1 ? 'crit' : r>=0.8 ? 'warn' : 'ok';
  const why = r>=0.8 ? (rA>=rC ? `Alter ${fmt(age,0)} von ${c.filterLifeMonths} Monaten` : `${f.cleanings} von ${c.filterMaxClean} Reinigungen`) : '';
  return {age, r, s, why};
}
const FSTAT = {in:['eingebaut','ok'], spare:['sauber, bereit','ok'], dirty:['muss gereinigt werden','warn']};
function getWho(){ try{ return localStorage.getItem('spa-who')||''; }catch(e){ return ''; } }
function setWho(n){ try{ localStorage.setItem('spa-who', n); }catch(e){} }
function logDose(p, what, amount){ p.doses.push({at:new Date().toISOString(), what, amount:amount||'', by:getWho()}); if(p.doses.length>400) p.doses.shift(); }

const START_PLAN = [
  {d:[1,1], t:'Becken befüllen, SoftWater und UltraShock zugeben. pH prüfen, bei über 8 auf 6,8–7,8 regulieren.'},
  {d:[2,2], t:'Baden, wenn das Wasser klar und geruchlos ist. Abends Basic zugeben. pH prüfen.'},
  {d:[3,6], t:'pH täglich prüfen (ggf. 2× täglich justieren). Nach jedem Bad UltraShock: 5 ml pro Person, mindestens 10 ml.'},
  {d:[7,7], t:'pH prüfen und Filter reinigen.'},
  {d:[8,14], t:'Wochendosis Basic + UltraShock. UltraShock-Wert am Tag nach der Zugabe mindestens 0,3 mg/l.'},
];

/* ================= Speicher (PocketBase-Server) ================= */
let state = { pools: { whirlpool: defaultPool('whirlpool'), swimspa: defaultPool('swimspa') } };
let cur = 'whirlpool', view = 'home', lastEval = null;
const pb = new PocketBase(location.origin);
let recId=null, saving=false, pendingSave=false, saveTimer=null, dirty=false;

function migrate(s){
  for (const k of ['whirlpool','swimspa']){
    const d = defaultPool(k), p = s.pools?.[k] || {};
    s.pools = s.pools || {};
    s.pools[k] = {...d, ...p, cfg:{...d.cfg, ...(p.cfg||{}), intervals:{...d.cfg.intervals, ...(p.cfg?.intervals||{})}}};
    const q=s.pools[k];
    if (!q.filters) q.filters=d.filters;
    if (k==='whirlpool' && !q.cfg.volConfirmed && q.cfg.vol===1300){ q.cfg.vol=1325; q.cfg.volConfirmed=true; if(q.name==='Whirlpool') q.name='Cameo'; if(!q.cfg.dosesCustom) Object.assign(q.cfg, defaultDoses('whirlpool',1325)); }
  }
  return s;
}
// Zwei Stände zusammenführen: Listen werden vereinigt, Einstellungen vom neueren Stand
function mergeState(srv, loc){
  if (!srv) return loc; if (!loc) return srv;
  const newer = (loc.savedAt||'') >= (srv.savedAt||'') ? loc : srv, older = newer===loc ? srv : loc;
  const out = JSON.parse(JSON.stringify(newer));
  for (const k of Object.keys(out.pools||{})){
    const n=out.pools[k], o=older.pools?.[k]; if(!o) continue;
    const uni=(A,B,key)=>{ const m=new Map(); [...(B||[]),...(A||[])].forEach(x=>m.set(key(x),x)); return [...m.values()].sort((x,y)=>x.at<y.at?-1:1); };
    n.log = uni(n.log,o.log,x=>x.id||x.at).filter(x=>!(n.deleted||[]).includes(x.id));
    n.doses = uni(n.doses,o.doses,x=>x.at+'|'+x.what).slice(-400);
    n.baths = uni(n.baths,o.baths,x=>x.at).slice(-300);
    n.deleted = [...new Set([...(n.deleted||[]),...(o.deleted||[])])].slice(-200);
    n.log = n.log.filter(x=>!n.deleted.includes(x.id)).slice(-400);
    for (const t of Object.keys(o.tasks||{})) if (!n.tasks[t] || o.tasks[t]>n.tasks[t]) n.tasks[t]=o.tasks[t];
  }
  return out;
}
let renderPending=false;
function softRender(){ // bei Daten von anderen Geräten nicht neu aufbauen, solange ein Eingabefeld offen ist
  const a=document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ if(!renderPending){ renderPending=true; a.addEventListener('blur',()=>{ renderPending=false; setTimeout(render,0); },{once:true}); } return; }
  if (document.querySelector('#modal .modal')) return;
  render();
}
function setSync(t){ const el=document.getElementById('sync'); if(el) el.textContent=t; }
function keepLocal(){ try{ localStorage.setItem('spa-state', JSON.stringify(state)); localStorage.setItem('spa-dirty', dirty?'1':''); }catch(e){} }

function save(){
  state.savedAt=new Date().toISOString(); dirty=true; keepLocal();
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500);
}
async function flush(){
  if (!pb.authStore.isValid || !dirty) return;
  if (saving){ pendingSave=true; return; }
  saving=true; setSync('speichert …');
  try{
    let srv=null;
    try{ const r = await pb.collection('spa_state').getFirstListItem('key="main"'); recId=r.id; srv=r.data; }catch(e){ if(e.status!==404) throw e; }
    const merged = migrate(mergeState(srv, state));
    let r;
    if (recId) r = await pb.collection('spa_state').update(recId, {data:merged});
    else { r = await pb.collection('spa_state').create({key:'main', data:merged}); recId=r.id; }
    const fin = migrate(JSON.parse(JSON.stringify(r.data||merged))); // Stand, wie ihn der Server gespeichert hat
    const changed = JSON.stringify(fin)!==JSON.stringify(state);
    state=fin; dirty=false; keepLocal(); setSync('✓ gespeichert');
    if (changed) softRender();
  }catch(e){ setSync(navigator.onLine?'nicht gespeichert – neuer Versuch folgt':'offline – wird nachgeholt'); }
  saving=false;
  if (pendingSave){ pendingSave=false; flush(); }
}
window.addEventListener('online', flush);
setInterval(()=>{ if(dirty) flush(); }, 30000);

async function loadServer(){
  setSync('lädt …');
  try{
    const r = await pb.collection('spa_state').getFirstListItem('key="main"'); recId=r.id;
    state = migrate(dirty ? mergeState(r.data, state) : JSON.parse(JSON.stringify(r.data)));
    keepLocal(); softRender(); setSync('✓ aktuell');
    if (dirty) flush();
  }catch(e){
    if (e.status===404){ dirty=true; flush(); } else setSync('offline – zeigt letzten Stand');
  }
  try{
    await pb.collection('spa_state').subscribe('*', ev=>{
      if (ev.action==='delete' || saving || dirty) return;
      if (JSON.stringify(ev.record.data)!==JSON.stringify(state)){ state=migrate(JSON.parse(JSON.stringify(ev.record.data))); recId=ev.record.id; keepLocal(); softRender(); }
    });
  }catch(e){}
}

async function loginScreen(){
  let needsSetup=false;
  try{ needsSetup = (await (await fetch('/api/spa/status')).json()).needsSetup; }catch(e){}
  document.getElementById('pools').innerHTML=''; document.getElementById('nav').innerHTML='';
  document.getElementById('main').innerHTML = needsSetup ? `<div class="card"><h2>Ersteinrichtung</h2>
    <p class="small">Lege den ersten Zugang (Admin) an. Den Einrichtungscode bekommst du von Claude.</p>
    <form id="setupF"><label>Einrichtungscode</label><input name="code" autocomplete="off">
    <label>Dein Name</label><input name="name" placeholder="z. B. Michael">
    <label>Benutzername</label><input name="username" autocapitalize="none" placeholder="klein, ohne Leerzeichen">
    <label>Passwort (mind. 10 Zeichen)</label><input name="password" type="password">
    <button class="btn full">Einrichten</button><p class="small" id="lerr" style="color:var(--crit)"></p></form></div>`
  : `<div class="card"><h2>Anmelden</h2><form id="loginF">
    <label>Benutzername</label><input name="username" autocapitalize="none" autocomplete="username">
    <label>Passwort</label><input name="password" type="password" autocomplete="current-password">
    <button class="btn full">Anmelden</button><p class="small" id="lerr" style="color:var(--crit)"></p></form></div>`;
  setSync('');
  const f=document.getElementById(needsSetup?'setupF':'loginF');
  f.addEventListener('submit', async e=>{
    e.preventDefault(); const d=Object.fromEntries(new FormData(f)); const err=document.getElementById('lerr'); err.textContent='';
    try{
      if (needsSetup){
        const r=await fetch('/api/spa/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
        const j=await r.json(); if(!r.ok) throw new Error(j.message||'Fehler');
      }
      await pb.collection('users').authWithPassword(String(d.username).trim().toLowerCase(), d.password);
      start();
    }catch(ex){ err.textContent = ex.message && !/Failed to authenticate/.test(ex.message) ? ex.message : 'Benutzername oder Passwort stimmt nicht.'; }
  });
}
async function start(){
  try{ const ls = localStorage.getItem('spa-state'); if (ls) state = migrate(JSON.parse(ls)); dirty = localStorage.getItem('spa-dirty')==='1'; }catch(e){}
  if (!pb.authStore.isValid) return loginScreen();
  render();
  try{ if (navigator.onLine) await pb.collection('users').authRefresh(); }catch(e){ if (e.status===401||e.status===403){ pb.authStore.clear(); return loginScreen(); } }
  loadServer();
}
async function initDb(){ start(); }

function banners(){
  const p=P(), out=[];
  if (!p.active) out.push(`<div class="banner"><b>${esc(p.name)} ist als „geplant“ markiert.</b> Unter Einstellungen aktivieren, sobald er läuft.</div>`);
  if (!p.cfg.volConfirmed) out.push(`<div class="banner"><b>Bitte Wasservolumen prüfen:</b> eingestellt sind ${fmt(p.cfg.vol)} l. Alle Dosierungen hängen davon ab. <a href="#" data-view="settings">Jetzt anpassen</a></div>`);
  if (p.type==='swimspa' && !p.cfg.basicWeek) out.push(`<div class="banner"><b>Basic-Wochendosis fehlt:</b> Bitte den Wert für den Swim-Spa aus der SpaBalancer-Anleitung oder vom Etikett eintragen.</div>`);
  const ph = startPhase(p);
  if (ph){
    const step = START_PLAN.find(s=>ph>=s.d[0]&&ph<=s.d[1]);
    out.push(`<div class="banner"><b>Startphase nach Neubefüllung – Tag ${ph} von 14</b><br>${esc(step?.t||'')}</div>`);
  }
  return out.join('');
}

function chart(log, key, band, yMin, yMax){
  const pts = log.filter(m=>m[key]!=null).slice(-30);
  if (pts.length<1) return '<p class="small">Noch keine Werte.</p>';
  const W=640,H=200,pl=36,pr=10,pt=10,pb=26;
  const vals=pts.map(m=>m[key]);
  const lo = yMin ?? Math.min(...vals, band[0]), hi = yMax ?? Math.max(...vals, band[1]*0.4, band[0]*2)*1.15;
  const t0=new Date(pts[0].at).getTime(), t1=Math.max(t0+DAY, new Date(pts[pts.length-1].at).getTime());
  const x=t=>pl+(new Date(t).getTime()-t0)/(t1-t0)*(W-pl-pr), y=v=>pt+(1-(Math.min(Math.max(v,lo),hi)-lo)/(hi-lo))*(H-pt-pb);
  const bTop=y(Math.min(band[1],hi)), bBot=y(Math.max(band[0],lo));
  const ticks=[lo,(lo+hi)/2,hi];
  const path=pts.map((m,i)=>(i?'L':'M')+x(m.at).toFixed(1)+','+y(m[key]).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
   <rect x="${pl}" y="${bTop}" width="${W-pl-pr}" height="${Math.max(0,bBot-bTop)}" fill="var(--okbg)"/>
   ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--mute)">${fmt(v,1)}</text>`).join('')}
   <path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2.5"/>
   ${pts.map(m=>`<circle cx="${x(m.at)}" cy="${y(m[key])}" r="4" fill="var(--brand)"/>`).join('')}
   <text x="${pl}" y="${H-6}" font-size="11" fill="var(--mute)">${dstr(pts[0].at)}</text>
   <text x="${W-pr}" y="${H-6}" font-size="11" text-anchor="end" fill="var(--mute)">${dstr(pts[pts.length-1].at)}</text>
  </svg><div class="hint">Grün = Zielbereich</div>`;
}

      document.getElementById('ulist').addEventListener('click', async e=>{ const b=e.target.closest('[data-udel]'); if(!b) return;
        if (b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='Wirklich?'; return; }
        try{ await pb.collection('users').delete(b.dataset.udel); toast('Zugang gelöscht'); loadUsers(); }catch(ex){ toast('Löschen fehlgeschlagen'); } });
      document.getElementById('uform').addEventListener('submit', async e=>{ e.preventDefault(); const d=Object.fromEntries(new FormData(e.target));
        const un=String(d.username||'').trim().toLowerCase();
        if(!/^[a-z0-9._-]{3,40}$/.test(un)) return toast('Benutzername: 3–40 Zeichen, nur a–z, 0–9, . - _');
        if(String(d.password||'').length<8) return toast('Passwort: mindestens 8 Zeichen');
        try{ await pb.collection('users').create({username:un, name:String(d.name||un), password:d.password, passwordConfirm:d.password, role:d.admin?'admin':'familie', verified:true});
          toast('Zugang angelegt'); e.target.reset(); loadUsers(); }catch(ex){ toast('Anlegen fehlgeschlagen – Benutzername schon vergeben?'); } });
      document.getElementById('impBtn').onclick=()=>{ try{ const imp=migrate(JSON.parse(document.getElementById('impText').value)); imp.savedAt='0';
          state=migrate(mergeState(imp, state)); save(); render(); toast('Daten übernommen'); }catch(e){ toast('Text ist kein gültiger Datenstand'); } };
    }
    document.getElementById('exportBtn').onclick=async()=>{
      try{ await navigator.clipboard.writeText(JSON.stringify(state,null,1)); toast('In die Zwischenablage kopiert'); }catch(e){ toast('Kopieren nicht möglich'); }
    };
  }
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-pool],[data-done],[data-bath],[data-del],[data-wgo],[data-wstep],[data-close],[data-swapin],[data-fclean],[data-fcleanin],[data-fnew],[data-fedit],[data-fsave]'); if(!t) return;
  const p0=P(), F=n=>p0.filters.find(f=>f.n===+n), now=new Date().toISOString();
  if (t.dataset.close!==undefined){ if(e.target===t || t.tagName==='BUTTON') closeModal(); return; }
  if (t.dataset.wgo){ wiz.step=Math.max(0,Math.min(6,wiz.step+ +t.dataset.wgo)); if(wiz.step===5&&!wiz.ev) wiz.step=4; render(); window.scrollTo(0,0); return; }
  if (t.dataset.wstep){ wiz.step=+t.dataset.wstep; render(); return; }
  if (t.dataset.swapin){ const out=p0.filters.find(f=>f.status==='in'), inn=F(t.dataset.swapin);
    if(out){ out.status='dirty'; if(!out.uses) out.uses=1; }
    inn.status='in'; inn.uses=(inn.uses||0)+1; if(!inn.since) inn.since=now;
    p0.tasks.filter=now; logDose(p0, `Filter getauscht: ${out?out.n:'–'} → ${inn.n}`); closeModal(); save(); render(); toast(`Filter ${inn.n} eingesetzt`); return; }
  if (t.dataset.fclean){ const f=F(t.dataset.fclean); f.cleanings++; f.lastClean=now; f.status='spare'; logDose(p0, `Filter ${f.n} gereinigt`, `${f.cleanings}. Reinigung`); save(); render(); toast(`Filter ${f.n}: ${f.cleanings}. Reinigung`); return; }
  if (t.dataset.fcleanin){ const f=F(t.dataset.fcleanin); f.cleanings++; f.lastClean=now; if(!f.since) f.since=now; p0.tasks.filter=now; logDose(p0, `Filter ${f.n} gereinigt (eingebaut)`, `${f.cleanings}. Reinigung`); closeModal(); save(); render(); toast(`Filter ${f.n}: ${f.cleanings}. Reinigung`); return; }
  if (t.dataset.fnew){ const f=F(t.dataset.fnew); f.since=f.status==='in'?now:null; f.cleanings=0; f.lastClean=null; f.uses=f.status==='in'?1:0; if(f.status==='dirty') f.status='spare'; logDose(p0, `Filter ${f.n} durch neuen ersetzt`); save(); render(); toast(`Filter ${f.n} neu`); return; }
  if ((t.dataset.fedit||t.dataset.fsave) && !isAdmin()) return;
  if (t.dataset.fedit){ openFilterEdit(t.dataset.fedit); return; }
  if (t.dataset.fsave){ const f=F(t.dataset.fsave), v=id=>document.getElementById(id).value, toIso=x=>x?new Date(x+'T12:00').toISOString():null;
    const st=v('fe_status'); if (st==='in' && f.status!=='in'){ const o=p0.filters.find(x=>x.status==='in'); if(o) o.status='dirty'; }
    f.since=toIso(v('fe_since')); f.lastClean=toIso(v('fe_last')); f.cleanings=Math.max(0,parseInt(v('fe_clean'))||0); f.status=st; if(f.since&&!f.uses) f.uses=1;
    logDose(p0, `Filter ${f.n} korrigiert`); closeModal(); save(); render(); toast('Gespeichert'); return; }
  if (t.dataset.done==='filter' && p0.filters?.length){ openSwap(); return; }
  if (t.dataset.view){ e.preventDefault(); view=t.dataset.view; render(); window.scrollTo(0,0); }
  else if (t.dataset.pool){ cur=t.dataset.pool; render(); }
  else if (t.dataset.done){
    const p=P(), k=t.dataset.done, task=TASKS.find(x=>x.k===k); p.tasks[k]=new Date().toISOString();
    if (k==='weekly'){ logDose(p, 'Basic + UltraShock (Woche)', `${p.cfg.basicWeek??'?'} ml / ${p.cfg.usWeek} ml`); }
    else if (k==='soft'){ logDose(p, 'SoftWater', `${round5(50*p.cfg.vol/1000)} ml`); }
    else logDose(p, task.name+' erledigt');
    if (k==='change'){ p.filledAt=p.tasks[k]; }
    save(); render(); toast(task.name+' ✓');
  }
  else if (t.dataset.bath){
    const n=+t.dataset.bath, ml=Math.max(10,5*n), p=P(), at=new Date().toISOString();
    p.baths.push({at, persons:n}); if(p.baths.length>300) p.baths.shift();
    logDose(p, `UltraShock nach Bad (${n} Pers.)`, `${ml} ml`);
    save(); render(); toast(`Jetzt ${ml} ml UltraShock zugeben`);
  }
  else if (t.dataset.del && isAdmin()){ const p=P(); p.log=p.log.filter(m=>m.id!==t.dataset.del); p.deleted=[...(p.deleted||[]),t.dataset.del]; save(); render(); }
});

initDb();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

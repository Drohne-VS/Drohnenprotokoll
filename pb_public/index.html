<style>
/* Layout: Einsatzleitstand – feste Kopfleiste mit Reitern, darunter eine Arbeitsspalte (max. 1120px), Formulare in Abschnitten wie ein Vordruck */
:root {
  --bg: #EEF0EE;
  --surface: #FFFFFF;
  --sunken: #E4E7E5;
  --ink: #1A1E22;
  --muted: #5B656D;
  --line: #CDD2CF;
  --accent: #AF2B1E;        /* RAL 3000 Feuerrot */
  --accent-ink: #FFFFFF;
  --accent-soft: #F6E3E0;
  --chart: #1F4E79;         /* Lagekarten-Blau */
  --chart-soft: rgba(31,78,121,.14);
  --ok: #2E7048; --ok-soft: #E1F0E6;
  --warn: #9A6400; --warn-soft: #FBEFD6;
  --uebung: #1F4E79; --uebung-soft: #E1EAF3;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111417; --surface: #191D21; --sunken: #22272C; --ink: #E5E8E6; --muted: #98A2AA; --line: #2E353B;
  --accent: #E0533F; --accent-ink: #FFFFFF; --accent-soft: #3A1E1A; --chart: #7FB1DE; --chart-soft: rgba(127,177,222,.16);
  --ok: #6CC08C; --ok-soft: #1B3326; --warn: #E2AE52; --warn-soft: #3A2E15; --uebung: #8DB8E3; --uebung-soft: #1C2C3D;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111417; --surface: #191D21; --sunken: #22272C; --ink: #E5E8E6; --muted: #98A2AA; --line: #2E353B;
  --accent: #E0533F; --accent-ink: #FFFFFF; --accent-soft: #3A1E1A; --chart: #7FB1DE; --chart-soft: rgba(127,177,222,.16);
  --ok: #6CC08C; --ok-soft: #1B3326; --warn: #E2AE52; --warn-soft: #3A2E15; --uebung: #8DB8E3; --uebung-soft: #1C2C3D;
  color-scheme: dark; }

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.who { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.who-n { display: grid; font-weight: 600; font-size: 13.5px; line-height: 1.15; text-align: right; }
.who-n small { font-weight: 400; color: var(--muted); font-size: 12px; }
.auth { max-width: 420px; margin: 6vh auto 0; width: 100%; }
.auth form { display: grid; gap: 14px; }
.auth button[type="submit"] { justify-content: center; padding: 12px; font-size: 15px; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in, .main { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; padding-block: 10px 0; }
.brand { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-logo { height: 40px; width: auto; max-width: 120px; flex: none; object-fit: contain; }
.logo-box { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }

.logo-prev img { max-width: 88px; max-height: 88px; object-fit: contain; }
.brand-t { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand-s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 100%; flex-basis: 100%; }
.tab { font-family: var(--f-display); font-weight: 600; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 8px 12px 10px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--chart); outline-offset: 2px; }

.main { padding-block: 22px 60px; display: grid; gap: 18px; }

h1 { font-size: 30px; letter-spacing: .01em; }
h2 { font-size: 19px; letter-spacing: .05em; text-transform: uppercase; }

.mono { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.grid { display: grid; gap: 12px 14px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.grid .w2 { grid-column: span 2; }

@media (max-width: 440px) { .grid .w2 { grid-column: 1 / -1; } }
label.f { display: grid; gap: 4px; min-width: 0; }
label.f > span { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input, select, textarea { font: 400 15px/1.3 var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 8px 9px; width: 100%; min-width: 0; }
textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
input[type="time"], input[type="date"], input.mono { font-family: var(--f-mono); font-size: 14px; }
input:disabled, select:disabled, textarea:disabled { opacity: .85; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--surface); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.chip { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px 3px; border-radius: 3px; white-space: nowrap; }
.chip.einsatz { background: var(--accent-soft); color: var(--accent); }
.chip.uebung { background: var(--uebung-soft); color: var(--uebung); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }

.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.gruen { background: var(--ok); } .dot.gelb { background: var(--warn); } .dot.rot { background: var(--accent); } .dot.keine { background: var(--line); }
.plink { color: inherit; text-decoration: none; font-weight: 600; }
.plink:hover { color: var(--accent); text-decoration: underline; }
.rule-in { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rule-in input { width: 70px; text-align: center; }
.routine-legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.routine-legend span { display: inline-flex; gap: 6px; align-items: center; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { font: 600 12.5px/1.2 var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.link { cursor: pointer; }
tbody tr.link:hover { background: var(--sunken); }
tfoot td { font-weight: 600; border-top: 2px solid var(--ink); border-bottom: 0; }

.mlist { display: grid; }
.mrow { display: grid; grid-template-columns: 92px 1fr auto; gap: 4px 16px; padding: 13px 18px; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; border-radius: 0; width: 100%; font: inherit; color: inherit; align-items: center; }
.mrow:last-child { border-bottom: 0; }
.mrow:hover { background: var(--sunken); border-color: var(--line); }
.mrow .d { font-family: var(--f-mono); font-size: 13px; line-height: 1.3; }
.mrow .d b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: .01em; }
.mrow .t { min-width: 0; }
.mrow .t strong { font-weight: 600; font-size: 16px; display: block; overflow-wrap: anywhere; }
.mrow .t .meta { color: var(--muted); font-size: 13.5px; display: flex; gap: 6px 12px; flex-wrap: wrap; margin-top: 2px; }
.mrow .k { text-align: right; display: grid; gap: 4px; justify-items: end; }
.mrow .k .ft { font-family: var(--f-mono); font-size: 14px; }
@media (max-width: 560px) { .mrow { grid-template-columns: 70px 1fr; } .mrow .k { grid-column: 2; justify-items: start; text-align: left; display: flex; gap: 8px; align-items: center; } }

.empty { padding: 34px 22px; display: grid; gap: 10px; justify-items: start; }
.empty h3 { color: var(--ink); }
.empty p { color: var(--muted); max-width: 60ch; }

.banner { border-radius: var(--r); padding: 11px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); }
.banner.info { background: var(--sunken); color: var(--ink); }

/* Positionen + Skizze */
.posgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .posgrid { grid-template-columns: minmax(0, 1fr); } }
.pos { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.pos-top { display: grid; grid-template-columns: 34px 150px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
@media (max-width: 520px) { .pos-top { grid-template-columns: 34px minmax(0,1fr) auto; } .pos-top .pl { grid-column: 1 / -1; } }
.sym { width: 30px; height: 30px; display: grid; place-items: center; font: 700 13px/1 var(--f-display); border-radius: 4px; color: #fff; }
.pos-coord { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.pos-out { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); display: flex; gap: 4px 14px; flex-wrap: wrap; }
.pos-out .err { color: var(--accent); font-family: var(--f-body); }
.pos-out a { color: var(--chart); }
.sketch { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.sketch canvas { display: block; width: 100%; height: 360px; touch-action: manipulation; }
.sketch-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--bg); font-size: 13px; }
.sketch-bar select { width: auto; padding: 5px 7px; font-size: 13px; }

/* Flüge */
.flight { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); display: grid; }
.flight-h { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.flight-h .fn { font: 700 18px/1 var(--f-display); letter-spacing: .03em; }
.flight-h .dur { margin-left: auto; font-family: var(--f-mono); font-size: 15px; font-weight: 500; }
.flight-b { padding: 12px; display: grid; gap: 12px; }
.crew { display: grid; gap: 6px; }
.crew-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; }
.slot { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 4px 10px; align-items: center; }
.slot .sl { font: 600 14px/1.15 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.slot .sl small { display: block; font: 400 12px/1.3 var(--f-body); text-transform: none; letter-spacing: 0; color: var(--muted); }
@media (max-width: 520px) { .slot { grid-template-columns: minmax(0, 1fr); } }
.crew-note { font-size: 13px; color: var(--muted); }
.crew-note.warn { color: var(--warn); font-weight: 600; }
.log { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.log-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); align-items: baseline; background: var(--surface); }
.log-row:last-child { border-bottom: 0; }
.log-row .tm { font-family: var(--f-mono); font-size: 14px; font-weight: 500; }
.log-row .tx { overflow-wrap: anywhere; }
.log-row .tx .tag { font: 600 11.5px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.log-in { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 8px; }
@media (max-width: 520px) { .log-in { grid-template-columns: 96px minmax(0, 1fr); } .log-in button { grid-column: 1 / -1; } }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.quick button.go, .quick button.stop { font-size: 16px; padding: 12px 18px; }
.wx { display: flex; gap: 10px 22px; flex-wrap: wrap; }
.wx-g { display: grid; gap: 5px; }
.wx-l { font: 600 13px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pick { display: flex; flex-wrap: wrap; gap: 4px; }
.pick button { padding: 7px 11px; font-weight: 500; font-size: 13.5px; background: var(--bg); }
.pick button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.crewline { font-size: 14px; display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: baseline; }
.crewline a { color: var(--chart); font-size: 13px; }
details.extra > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; }
details.extra > summary::-webkit-details-marker { display: none; }
details.extra > summary::before { content: "▸"; font-size: 14px; color: var(--muted); transition: transform .15s; }
details.extra[open] > summary::before { transform: rotate(90deg); }
details.extra[open] { display: grid; gap: 14px; }
.quick button.go { background: var(--ok); border-color: var(--ok); color: #fff; }
.quick button.stop { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.team-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; }

.sticky-actions { position: sticky; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-radius: 0 0 var(--r) var(--r); }
.sticky-actions .state { color: var(--muted); font-size: 13px; margin-right: auto; }
.sticky-actions .state.dirty { color: var(--warn); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; }
.stat .l { font: 600 12px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat .v { font: 700 28px/1.1 var(--f-display); margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 15px; color: var(--muted); font-weight: 600; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: var(--r); font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); padding: 4px 6px 4px 10px; border-radius: var(--r); font-size: 13px; }

.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

          <path d="M10.5 10.5 L21.5 21.5 M21.5 10.5 L10.5 21.5"/>

<script>
// UTM / UTMREF (MGRS) – WGS84
const GEO = (() => {
  const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996;
  const e2 = f * (2 - f), ep2 = e2 / (1 - e2), rad = Math.PI / 180;
  const BANDS = "CDEFGHJKLMNPQRSTUVWX";
  const COLS = ["STUVWXYZ", "ABCDEFGH", "JKLMNPQR"];
  const ROWS = "ABCDEFGHJKLMNPQRSTUV";
  function zoneOf(lat, lon) {
    let z = Math.floor((lon + 180) / 6) + 1;

function downloadFile(filename, data) {
  const map = { "ä": "ae", "ö": "oe", "ü": "ue", "Ä": "Ae", "Ö": "Oe", "Ü": "Ue", "ß": "ss" };
  filename = String(filename).replace(/[äöüÄÖÜß]/g, c => map[c]).replace(/[^A-Za-z0-9._-]+/g, "_");
  const blob = data instanceof Blob ? data : new Blob([data], { type: /\.csv$/.test(filename) ? "text/csv;charset=utf-8" : "application/octet-stream" });
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

      ctx.setLineDash([3 * unit, 4 * unit]); ctx.strokeStyle = pal.muted; ctx.lineWidth = 1.2 * unit; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = pal.muted; ctx.font = `500 ${11 * unit}px ${pal.mono}`; ctx.textAlign = "center";
      ctx.fillText(fmtM(GEO.dist(st.p, o.p)), (a + c) / 2, (b + d) / 2 - 5 * unit);

  }
  // Punkte
  const r = 11 * unit;
  M.xy.forEach(o => {
    const t = PT[o.p.typ] || PT.sonst; const [u, v] = M.px(o.x, o.y);
    ctx.fillStyle = t.c; ctx.strokeStyle = pal.bg; ctx.lineWidth = 2 * unit; ctx.beginPath();
    if (o.p.typ === "ziel") { ctx.moveTo(u, v - r * 1.15); ctx.lineTo(u + r * 1.15, v); ctx.lineTo(u, v + r * 1.15); ctx.lineTo(u - r * 1.15, v); ctx.closePath(); }

    ctx.fillStyle = "#FFFFFF"; ctx.font = `700 ${(o.p.typ === "gebiet" ? 9 : 12) * unit}px ${pal.font}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(t.s, u, v + (o.p.typ === "fund" ? 2 * unit : 0) + .5);
    ctx.textBaseline = "alphabetic";

      const tx = u + r + 5 * unit, ty = v + 4 * unit; const tw = ctx.measureText(o.p.label).width;
      ctx.fillStyle = pal.labelBg; ctx.fillRect(tx - 3 * unit, ty - 12 * unit, tw + 6 * unit, 16 * unit);
      ctx.fillStyle = pal.ink; ctx.fillText(o.p.label, tx, ty);

  const nx = W - 26 * unit, ny = 18 * unit;
  ctx.fillStyle = pal.ink; ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(nx + 8 * unit, ny + 22 * unit); ctx.lineTo(nx, ny + 17 * unit); ctx.lineTo(nx - 8 * unit, ny + 22 * unit); ctx.closePath(); ctx.fill();
  ctx.font = `700 ${12 * unit}px ${pal.font}`; ctx.textAlign = "center"; ctx.fillText("N", nx, ny + 36 * unit);
  // Maßstab
  const sb = step * M.s, bx = 14 * unit, by = H - 16 * unit;
  ctx.fillStyle = pal.labelBg; ctx.fillRect(bx - 6 * unit, by - 20 * unit, sb + 60 * unit, 28 * unit);
  ctx.strokeStyle = pal.ink; ctx.lineWidth = 2 * unit; ctx.beginPath(); ctx.moveTo(bx, by - 6 * unit); ctx.lineTo(bx, by); ctx.lineTo(bx + sb, by); ctx.lineTo(bx + sb, by - 6 * unit); ctx.stroke();

}

async function uploadLogo(file) {
  if (!/^image\/(png|jpeg)$/.test(file.type)) { toast("Bitte eine PNG- oder JPG-Datei wählen."); return; }
  if (file.size > 5 * 1024 * 1024) { toast("Die Datei ist zu groß (max. 5 MB)."); return; }
  toast("Logo wird hochgeladen …");
  try { await Store.setLogo(file); toast("Logo gespeichert"); }
  catch (e) { toast("Hochladen fehlgeschlagen" + (e && e.status ? " (" + e.status + ")" : "") + "."); }
}
async function loadLogo() {
  if (!S.config.logoUrl) return null;
  try {
    const res = await fetch(S.config.logoUrl); if (!res.ok) return null;
    const blob = await res.blob();
    const url = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(blob); });
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const cv = document.createElement("canvas"); const k = Math.min(1, 600 / Math.max(img.width, img.height));
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    const cx = cv.getContext("2d"); cx.fillStyle = "#FFFFFF"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    return { data: cv.toDataURL("image/jpeg", .92), w: cv.width, h: cv.height };
  } catch (e) { return null; }
}

const P = { ML: 16, CW: 178, BOT: 279, red: [175, 43, 30], ink: [26, 30, 34], muted: [91, 101, 109], line: [205, 210, 207], fill: [238, 240, 238] };

}
function clean(s) { return String(s ?? "").replace(/[→←]/g, "->").replace(/[  ]/g, " "); }
function ensure(c, h) { if (c.y + h > P.BOT) { c.doc.addPage(); c.y = 18; return true; } return false; }
function sec(c, t) {

  d.setFont("helvetica", "bold"); d.setFontSize(10.5); d.setTextColor(...P.red); d.text(clean(t).toUpperCase(), P.ML, c.y);
  d.setDrawColor(...P.red); d.setLineWidth(.4); d.line(P.ML, c.y + 1.6, P.ML + P.CW, c.y + 1.6); c.y += 6.5; d.setTextColor(...P.ink);
}

  const flush = () => {
    if (!row.length) return;
    const lines = row.map(([, v, sp]) => d.splitTextToSize(clean(v) || "–", cw * (sp || 1) - 3));
    const h = 4 + Math.max(...lines.map(l => l.length)) * 4.3 + 2.5;
    ensure(c, h); let x = P.ML;
    row.forEach(([k, , sp], j) => {
      d.setFont("helvetica", "normal"); d.setFontSize(7.5); d.setTextColor(...P.muted); d.text(clean(k).toUpperCase(), x, c.y);
      d.setFontSize(10); d.setTextColor(...P.ink); d.text(lines[j], x, c.y + 4.5); x += cw * (sp || 1);
    });
    c.y += h; row = []; used = 0;
  };
  items.forEach(it => { const sp = it[2] || 1; if (used + sp > cols) flush(); row.push(it); used += sp; });
  flush();
}
function para(c, label, text) {
  const d = c.doc; const lines = d.splitTextToSize(clean(text) || "–", P.CW);
  ensure(c, 10); d.setFont("helvetica", "normal"); d.setFontSize(7.5); d.setTextColor(...P.muted); d.text(clean(label).toUpperCase(), P.ML, c.y); c.y += 4.5;
  d.setFontSize(10); d.setTextColor(...P.ink);
  lines.forEach(l => { ensure(c, 5); d.text(l, P.ML, c.y); c.y += 4.6; }); c.y += 2.5;
}
function table(c, head, rows, widths, opts = {}) {

  const right = opts.right || [];
  const drawHead = () => {
    d.setFillColor(...P.fill); d.rect(P.ML, c.y, P.CW, 7, "F");
    d.setFont("helvetica", "bold"); d.setFontSize(8); d.setTextColor(...P.muted);
    let x = P.ML; head.forEach((h, i) => { right.includes(i) ? d.text(clean(h), x + W[i] - 1.5, c.y + 4.8, { align: "right" }) : d.text(clean(h), x + 1.5, c.y + 4.8); x += W[i]; }); c.y += 7;
  };
  ensure(c, 14); drawHead();
  rows.forEach((r, ri) => {
    const bold = opts.boldLast && ri === rows.length - 1;

    const cells = r.map((v, i) => d.splitTextToSize(clean(v), W[i] - 3));
    const h = Math.max(...cells.map(l => l.length)) * 4 + 3;
    if (ensure(c, h)) drawHead();
